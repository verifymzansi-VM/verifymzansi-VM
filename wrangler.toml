# ────────────────────────────────────────────────────────────────────────────
# No staging environment.
# The former [env.staging] block reused the production Supabase project, R2
# buckets, rate-limit KV namespace and rate-limiter Worker, so "staging" could
# reach production data. It was removed. A future staging environment must use
# its own Supabase project, buckets, KV namespace, rate limiter and hostnames;
# `pnpm cloudflare:staging:isolation -- --require-staging` refuses anything else.
# ────────────────────────────────────────────────────────────────────────────
