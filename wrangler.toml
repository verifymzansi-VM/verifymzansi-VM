name = "verifymzansi"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

# Main entry point wraps the generated OpenNext worker so custom Durable
# Objects can be exported alongside the adapter output.
main = "workers/open-next-entry.mjs"

# Custom build hook: Workers Builds (Cloudflare Git integration) runs a plain
# Next.js build, which never produces .open-next/. This hook runs the full
# OpenNext build when the output is missing (and skips when it already exists,
# e.g. GitHub Actions deploys). Without it `wrangler versions upload` fails
# with: assets.directory (.open-next/assets) does not exist.
[build]
command = "node scripts/ensure-opennext-build.mjs"

[limits]
cpu_ms = 30000

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ────────────────────────────────────────────────────────────────────────────
# Custom Domain Route
# ────────────────────────────────────────────────────────────────────────────
[[routes]]
pattern = "verifymzansi.com"
zone_name = "verifymzansi.com"
custom_domain = true

[[routes]]
pattern = "www.verifymzansi.com"
zone_name = "verifymzansi.com"
custom_domain = true

# ────────────────────────────────────────────────────────────────────────────
# Public Environment Variables (safe to commit — these are client-visible)
#
# ⚠️  NEXT_PUBLIC_* values are embedded in the browser bundle sent to every
#     user, so they are NOT secret. The Supabase publishable key is restricted
#     by API grants and SQL authorization; the Turnstile site key is public.
#     Real secrets go via `wrangler secret put` (see bottom of file).
# ────────────────────────────────────────────────────────────────────────────
[vars]
NODE_ENV = "production"
ENVIRONMENT = "production"
NEXT_PUBLIC_APP_URL = "https://verifymzansi.com"
NEXT_PUBLIC_MEDIA_URL = "https://media.verifymzansi.com"
R2_PUBLIC_URL = "https://media.verifymzansi.com"
R2_PUBLIC_BUCKET = "verifymzansi-public"
R2_PRIVATE_BUCKET = "verifymzansi-private"
NEXT_PUBLIC_SUPABASE_URL = "https://gntzjtuncsyefujajmjy.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_0nTWArCyTVta1nDx_U3u1Q_YOdMfZpi"
FOUNDATION_SUPABASE_URL = "https://gntzjtuncsyefujajmjy.supabase.co"
FOUNDATION_PROJECT_REF = "gntzjtuncsyefujajmjy"
FOUNDATION_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_0nTWArCyTVta1nDx_U3u1Q_YOdMfZpi"
FOUNDATION_PASSWORD_AUTH_MODE = "native-captcha"
FOUNDATION_REGISTRATION_ENABLED = "true"
# Sign-up is by invitation only (database sign-up guard); the registration
# reply says so. Set to "false" when public registration opens.
FOUNDATION_REGISTRATION_INVITE_ONLY = "true"
FOUNDATION_AUTH_CALLBACK_ENABLED = "true"
FOUNDATION_RECOVERY_ENABLED = "true"
FOUNDATION_PHONE_VERIFICATION_ENABLED = "true"
# Paid add-on sales (Urgent, Boost, Featured) stay paused until visitors can
# see what they deliver. Only "true" opens them (src/lib/billing/addon-sales.ts).
ADDON_SALES_ENABLED = "false"
# Staff refunds sent to Ozow through its API stay off until the owner has set
# the Ozow refund key (OZOW_REFUND_CLIENT_ID/_SECRET, refunds scope) and the
# refund webhook secret. Only "true" turns them on (src/lib/payments/ozow-refunds.ts).
OZOW_API_REFUNDS_ENABLED = "false"
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAACmVXwJ4jmJSu6fX"
# Not image resizing: the zone has no Cloudflare Image Resizing and nothing
# resizes images on the fly (src/lib/image-loader.ts). "true" only makes the
# image loader leave same-origin paths without an image extension unchanged.
NEXT_PUBLIC_CF_IMAGE_RESIZING = "true"
# OTP Rate Limiter Worker URL
OTP_RATE_LIMITER_URL = "https://verifymzansi-rate-limiter.verifymzansi.workers.dev"
OTP_RATE_LIMITER_TIMEOUT_MS = "2500"
# Fail-closed env validation — crash the worker at startup if any env var
# is missing or malformed.  See LAUNCH-CHECKLIST.md §8.
STRICT_ENV_STARTUP_BLOCK = "1"
# Production uses human KYC review until a signed provider integration is enabled.
# Keep this in the Worker configuration so a fresh deploy cannot fall back to
# the development-only `stub` provider during instrumentation startup.
KYC_PROVIDER = "manual"
# ⚠️ TEST_PHONE_NUMBERS and ENABLE_TEST_POSTING_BYPASS removed — these
# weaken security and must NEVER be set in production. Use them only in
# local .env for development/testing.

# ────────────────────────────────────────────────────────────────────────────
# Durable Objects for the @opennextjs/cloudflare caches (ISR, tags, queue)
# Nothing uses the three NEXT_CACHE_* objects today: open-next.config.ts sets
# no incremental cache, tag cache or queue, and every page renders per request.
# They stay bound because removing a Durable Object class needs its own
# reviewed migration (deleted_classes). Wrangler/workerd may warn during local
# startup or deploy validation that these classes are not exported yet.
#
# NOTE: RATE_LIMITER_DO (and the OTP_RATE_LIMITS KV binding further below)
# exist on the MAIN app worker only to satisfy the RateLimiterDO re-export
# in workers/open-next-entry.mjs. They are NOT used by the Next.js app for
# rate limiting (that goes to the standalone verifymzansi-rate-limiter
# worker) — but they must NOT be "cleaned up": removing them breaks the
# re-export and deployment.
# ────────────────────────────────────────────────────────────────────────────
[durable_objects]
bindings = [
  { name = "NEXT_CACHE_DO_QUEUE", class_name = "DOQueueHandler" },
  { name = "NEXT_TAG_CACHE_DO_SHARDED", class_name = "DOShardedTagCache" },
  { name = "NEXT_CACHE_DO_PURGE", class_name = "BucketCachePurge" },
  { name = "RATE_LIMITER_DO", class_name = "RateLimiterDO" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DOQueueHandler", "DOShardedTagCache", "BucketCachePurge"]

[[migrations]]
tag = "v2"
new_classes = ["RateLimiterDO"]

# ────────────────────────────────────────────────────────────────────────────
# KV Namespace for OTP Rate Limiting
# Exists to satisfy the RateLimiterDO re-export in
# workers/open-next-entry.mjs — see the [durable_objects] note above. The site
# also keeps its rough monthly Cloudflare Images count here (one key per
# month, `images-transformations:YYYY-MM`; src/lib/media/images-allowance.ts),
# which stops photo copies before they use the allowance re-encodes need.
# ────────────────────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "OTP_RATE_LIMITS"
id = "247144b6d9b1406093351378a57c62fa"

# ────────────────────────────────────────────────────────────────────────────
# Cloudflare Images (re-encodes every uploaded photo server-side)
# sharp cannot load in Workers, so src/lib/utils/image-reencode.ts uses this
# binding to re-save photos (dropping metadata and hidden content). Without it
# photo uploads are refused. Images Free: 5,000 unique transformations a
# month; over that, new ones fail (error 9422) until the next month (no
# charge), so photo uploads are refused with a clear message. The 800 px
# display copy stops at 60% of the month (src/lib/media/images-allowance.ts).
# Bindings are not inherited: keep [env.*.images] below in step.
# ────────────────────────────────────────────────────────────────────────────
[images]
binding = "IMAGES"

# ────────────────────────────────────────────────────────────────────────────
# Offload Worker (M9.9): CIPC PDF reading and link-preview cards run in
# verifymzansi-offload (wrangler.offload.toml) so pdf.js and @vercel/og stay
# out of this Worker (src/lib/offload/client.ts). Without it, PDF uploads and
# share previews answer "try again shortly" (503). Deploy it before this
# Worker. Bindings are not inherited: keep [[env.*.services]] below in step.
# ────────────────────────────────────────────────────────────────────────────
[[services]]
binding = "OFFLOAD"
service = "verifymzansi-offload"

# ────────────────────────────────────────────────────────────────────────────
# R2 Access
# ────────────────────────────────────────────────────────────────────────────
# The main app uses R2's S3-compatible API via the R2_* secrets below. Native
# Worker R2 bindings are intentionally omitted here because Cloudflare rejects
# version creation for this account with code 10136 even when bucket listing
# succeeds. Re-enable bindings only after Worker version creation accepts them.

# ────────────────────────────────────────────────────────────────────────────
# Server-Side Secrets (set via `pnpm wrangler secret put <NAME>`)
# NEVER add secret values to [vars] — they appear in build logs.
# ────────────────────────────────────────────────────────────────────────────
# Required secrets for this worker:
#   pnpm wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   pnpm wrangler secret put RESEND_API_KEY
#   pnpm wrangler secret put AFRICASTALKING_API_KEY
#   pnpm wrangler secret put AFRICASTALKING_USERNAME
#   pnpm wrangler secret put AFRICASTALKING_SENDER_ID
#   pnpm wrangler secret put OZOW_ENV
#   pnpm wrangler secret put OZOW_CLIENT_ID
#   pnpm wrangler secret put OZOW_CLIENT_SECRET
#   pnpm wrangler secret put OZOW_SITE_CODE
#   pnpm wrangler secret put OZOW_WEBHOOK_SECRET
#   pnpm wrangler secret put KYC_WEBHOOK_SECRET
#   pnpm wrangler secret put TURNSTILE_SECRET_KEY
#   pnpm wrangler secret put KYC_ENCRYPTION_KEY
#   pnpm wrangler secret put ID_ENCRYPTION_KEY
#   pnpm wrangler secret put HMAC_SECRET
#   pnpm wrangler secret put R2_ACCOUNT_ID
#   pnpm wrangler secret put R2_ACCESS_KEY_ID
#   pnpm wrangler secret put R2_SECRET_ACCESS_KEY
#   pnpm wrangler secret put IP_HASH_SECRET
#   pnpm wrangler secret put RATE_LIMITER_API_KEY
# Optional (the app keeps working and logs instead when unset):
#   pnpm wrangler secret put PAYMENT_ALERT_EMAILS   # staff payment alert addresses
#   # Only when turning on API refunds (OZOW_API_REFUNDS_ENABLED); never in code:
#   pnpm wrangler secret put OZOW_REFUND_CLIENT_ID      # Ozow API key with the refunds scope
#   pnpm wrangler secret put OZOW_REFUND_CLIENT_SECRET
#   pnpm wrangler secret put OZOW_REFUND_WEBHOOK_SECRET  # the refund.complete webhook's whsec_ secret
#   # Customer invoices (src/lib/billing/invoice-settings.ts); never in code.
#   # Unset, the invoice leaves the seller's address or the bank transfer out:
#   pnpm wrangler secret put INVOICE_SELLER_ADDRESS        # one line, commas between parts
#   pnpm wrangler secret put INVOICE_BANK_ACCOUNT_NAME     # all four bank settings, or none
#   pnpm wrangler secret put INVOICE_BANK_NAME
#   pnpm wrangler secret put INVOICE_BANK_ACCOUNT_NUMBER
#   pnpm wrangler secret put INVOICE_BANK_BRANCH_CODE
#   # NEVER set in production:
#   # PLAYWRIGHT_E2E_AUTH, PLAYWRIGHT_TEST_MODE, PLAYWRIGHT_SUPABASE_MODE,
#   # NEXT_PUBLIC_PLAYWRIGHT_TEST_MODE,
#   # NEXT_PUBLIC_PLAYWRIGHT_SUPABASE_MODE
#
# Verify with: pnpm wrangler secret list
#
# NOTE: production launch validation is strict. Missing any OZOW_* key or
# AFRICASTALKING_SENDER_ID can block startup and cause full-site request
# failures until the secret/binding is restored.

# ────────────────────────────────────────────────────────────────────────────
# Production Environment (deploy with: pnpm wrangler deploy --env production)
# Keep this explicit so CI can target production without Wrangler warning about
# multiple configured environments and an unspecified deploy target.
# ────────────────────────────────────────────────────────────────────────────
# Persist Workers Logs (7-day retention) so production errors can be
# investigated after the fact; without this only a live `wrangler tail` works.
[observability]
enabled = true
redact_query_string = true

[env.production]
name = "verifymzansi"
workers_dev = false
preview_urls = false

[env.production.observability]
enabled = true
redact_query_string = true

[env.production.limits]
cpu_ms = 30000

[[env.production.routes]]
pattern = "verifymzansi.com"
zone_name = "verifymzansi.com"
custom_domain = true

[[env.production.routes]]
pattern = "www.verifymzansi.com"
zone_name = "verifymzansi.com"
custom_domain = true

[env.production.durable_objects]
bindings = [
  { name = "NEXT_CACHE_DO_QUEUE", class_name = "DOQueueHandler" },
  { name = "NEXT_TAG_CACHE_DO_SHARDED", class_name = "DOShardedTagCache" },
  { name = "NEXT_CACHE_DO_PURGE", class_name = "BucketCachePurge" },
  { name = "RATE_LIMITER_DO", class_name = "RateLimiterDO" },
]

[[env.production.kv_namespaces]]
binding = "OTP_RATE_LIMITS"
id = "247144b6d9b1406093351378a57c62fa"

[env.production.images]
binding = "IMAGES"

[[env.production.services]]
binding = "OFFLOAD"
service = "verifymzansi-offload"

[env.production.vars]
NODE_ENV = "production"
ENVIRONMENT = "production"
NEXT_PUBLIC_APP_URL = "https://verifymzansi.com"
NEXT_PUBLIC_MEDIA_URL = "https://media.verifymzansi.com"
R2_PUBLIC_URL = "https://media.verifymzansi.com"
R2_PUBLIC_BUCKET = "verifymzansi-public"
R2_PRIVATE_BUCKET = "verifymzansi-private"
NEXT_PUBLIC_SUPABASE_URL = "https://gntzjtuncsyefujajmjy.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_0nTWArCyTVta1nDx_U3u1Q_YOdMfZpi"
FOUNDATION_SUPABASE_URL = "https://gntzjtuncsyefujajmjy.supabase.co"
FOUNDATION_PROJECT_REF = "gntzjtuncsyefujajmjy"
FOUNDATION_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_0nTWArCyTVta1nDx_U3u1Q_YOdMfZpi"
FOUNDATION_PASSWORD_AUTH_MODE = "native-captcha"
FOUNDATION_REGISTRATION_ENABLED = "true"
# Sign-up is by invitation only (database sign-up guard); the registration
# reply says so. Set to "false" when public registration opens.
FOUNDATION_REGISTRATION_INVITE_ONLY = "true"
FOUNDATION_AUTH_CALLBACK_ENABLED = "true"
FOUNDATION_RECOVERY_ENABLED = "true"
FOUNDATION_PHONE_VERIFICATION_ENABLED = "true"
ADDON_SALES_ENABLED = "false"
OZOW_API_REFUNDS_ENABLED = "false"
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAACmVXwJ4jmJSu6fX"
NEXT_PUBLIC_CF_IMAGE_RESIZING = "true"
OTP_RATE_LIMITER_URL = "https://verifymzansi-rate-limiter.verifymzansi.workers.dev"
