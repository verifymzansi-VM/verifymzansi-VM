name = "verifymzansi-rate-limiter"
main = "workers/rate-limiter.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Persist Workers Logs (7-day retention) so production errors can be
# investigated after the fact; without this only a live `wrangler tail` works.
[observability]
enabled = true

[vars]
ENVIRONMENT = "production"

# ────────────────────────────────────────────────────────────────────────────
# KV Namespace for OTP Rate Limiting
# ────────────────────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "OTP_RATE_LIMITS"
id = "247144b6d9b1406093351378a57c62fa"

[durable_objects]
bindings = [{ name = "RATE_LIMITER_DO", class_name = "RateLimiterDO" }]

[[migrations]]
tag = "v1"
new_classes = ["RateLimiterDO"]

# ────────────────────────────────────────────────────────────────────────────
# Secrets (set via `wrangler secret put`, NOT committed to source)
# ────────────────────────────────────────────────────────────────────────────
# WORKER_API_KEY — shared secret this worker hard-requires on every POST.
#   It MUST equal the main app's RATE_LIMITER_API_KEY (see wrangler.toml):
#   pnpm wrangler secret put WORKER_API_KEY -c wrangler.rate-limiter.toml
# Optional coordinated rotation: WORKER_API_KEY_NEXT (at least 32 characters)
# and WORKER_API_KEY_NEXT_EXPIRES_AT (UTC expiry, at most two hours ahead).
# Keep the primary key until the app changes, then replace it and clear both
# overlap bindings. Missing/expired/invalid overlap settings never authorize.

# ────────────────────────────────────────────────────────────────────────────
# Staging copy (M0.15b): the staging website's OTP_RATE_LIMITER_URL points here
# (https://verifymzansi-rate-limiter-staging.verifymzansi.workers.dev). Its own
# KV namespace and Durable Objects; never production's rate-limit state. Its
# WORKER_API_KEY must equal the staging website's RATE_LIMITER_API_KEY.
# Deploy with: pnpm exec wrangler deploy --config wrangler.rate-limiter.toml --env staging
# ────────────────────────────────────────────────────────────────────────────
[env.staging]
name = "verifymzansi-rate-limiter-staging"
# Never inherit the top-level routes: they hold production custom domains,
# and a deploy would move them to this Worker.
routes = []
workers_dev = true
preview_urls = false

[env.staging.vars]
ENVIRONMENT = "staging"

[[env.staging.kv_namespaces]]
binding = "OTP_RATE_LIMITS"
id = "c185233891a8436fadaa4fea712785f3" # verifymzansi-otp-rate-limits-staging

[env.staging.durable_objects]
bindings = [{ name = "RATE_LIMITER_DO", class_name = "RateLimiterDO" }]
