name = "verifymzansi-rate-limiter"
main = "workers/rate-limiter.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# ────────────────────────────────────────────────────────────────────────────
# KV Namespace for OTP Rate Limiting
# ────────────────────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "OTP_RATE_LIMITS"
id = "247144b6d9b1406093351378a57c62fa"

[durable_objects]
bindings = [{ name = "RATE_LIMITER_DO", class_name = "RateLimiterDO" }]

[[migrations]]
tag = "v1"
new_classes = ["RateLimiterDO"]

# ────────────────────────────────────────────────────────────────────────────
# Secrets (set via `wrangler secret put`, NOT committed to source)
# ────────────────────────────────────────────────────────────────────────────
# WORKER_API_KEY — shared secret this worker hard-requires on every POST.
#   It MUST equal the main app's RATE_LIMITER_API_KEY (see wrangler.toml):
#   pnpm wrangler secret put WORKER_API_KEY -c wrangler.rate-limiter.toml
