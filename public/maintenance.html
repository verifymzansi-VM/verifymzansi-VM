<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VerifyMzansi — Maintenance</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:#f8fafc;color:#1e293b;display:flex;align-items:center;justify-content:center;
      min-height:100vh;padding:1.5rem;text-align:center}
    .card{max-width:28rem;background:#fff;border-radius:0.75rem;padding:2.5rem 2rem;
      box-shadow:0 1px 3px rgba(0,0,0,.1)}
    h1{font-size:1.5rem;font-weight:700;margin-bottom:.5rem}
    p{color:#64748b;line-height:1.6;margin-top:.75rem}
    .icon{font-size:2.5rem;margin-bottom:1rem}
    .status{display:inline-block;margin-top:1.25rem;padding:.5rem 1rem;border-radius:9999px;
      background:#fef3c7;color:#92400e;font-size:.875rem;font-weight:500}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">🔧</div>
    <h1>We&rsquo;ll Be Right Back</h1>
    <p>
      VerifyMzansi is undergoing scheduled maintenance to improve
      performance and security. We expect to be back shortly.
    </p>
    <span class="status">503 — Service Unavailable</span>
    <p>
      If the issue persists, please contact
      <a href="mailto:support@verifymzansi.com">support@verifymzansi.com</a>.
    </p>
  </div>
</body>
</html>
