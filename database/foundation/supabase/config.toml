# UNRELEASED local BF-09 workspace. Never link to Mumbai or a hosted target.
# The only migration intentionally raises until its acceptance gates are closed.
project_id = "vm-foundation-unreleased"

[api]
enabled = true
port = 55541
schemas = ["api"]
extra_search_path = ["extensions"]
max_rows = 100
auto_expose_new_tables = false

[db]
port = 55542
shadow_port = 55540
major_version = 17

[db.seed]
enabled = false
sql_paths = []

[db.pooler]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:55540"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = true

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = false
[storage]
enabled = false
[edge_runtime]
enabled = false
[analytics]
enabled = false
