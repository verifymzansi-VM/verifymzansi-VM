# ════════════════════════════════════════════════════════════════════════════
# DEPRECATED — This worker is no longer triggered by the application.
#
# The canonical encryption path is the inline uploadKycDocument() flow in
# src/lib/services/storage.ts using v2 HMAC-SHA256 key derivation in
# src/lib/utils/encryption.ts.
#
# This worker remains deployed only for legacy decryption compatibility.
# It can be removed once all v1/worker-encrypted files have been purged
# by the retention-cleanup cron.
# ════════════════════════════════════════════════════════════════════════════

# ────────────────────────────────────────────────────────────────────────────
# Cloudflare Worker: KYC Document Encryptor (LEGACY)
#
# This worker was previously triggered via HTTP POST from the
# Next.js /api/verification/* routes. It is no longer invoked;
# see the deprecation notice above for the canonical flow.
#
# Deploy (legacy decryption support only):
#   pnpm wrangler deploy -c wrangler.kyc-encryptor.toml
#
# Set secrets (once per environment):
#   pnpm wrangler secret put KYC_ENCRYPTION_KEY -c wrangler.kyc-encryptor.toml
#   pnpm wrangler secret put SUPABASE_SERVICE_ROLE_KEY -c wrangler.kyc-encryptor.toml
# ────────────────────────────────────────────────────────────────────────────

name = "verifymzansi-kyc-encryptor"
main = "workers/kyc-encryptor.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://tnygdgormnofpgjknlhr.supabase.co"

# ────────────────────────────────────────────────────────────────────────────
# R2 Bucket Bindings
# ────────────────────────────────────────────────────────────────────────────
# Temp bucket — receives raw uploads via presigned URL
[[r2_buckets]]
binding = "TEMP_BUCKET"
bucket_name = "verifymzansi-temp"

# Private bucket — stores encrypted KYC artifacts
[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "verifymzansi-private"

# ────────────────────────────────────────────────────────────────────────────
# Secrets (set via `wrangler secret put`, NOT committed to source)
# ────────────────────────────────────────────────────────────────────────────
# KYC_ENCRYPTION_KEY   — 64-char hex string (32 bytes) for AES-256
# SUPABASE_SERVICE_ROLE_KEY — Supabase service role key for kyc_artifacts PATCH
# WORKER_API_KEY — shared secret the worker hard-requires on every POST
#   (must equal the value the caller sends; set via `wrangler secret put`)
