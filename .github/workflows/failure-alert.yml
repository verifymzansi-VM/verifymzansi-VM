name: Failure alert

# Opens one GitHub issue (or comments on it while it is open) when a run on
# main or a scheduled run of a watched workflow fails, so a red nightly, a red
# main CI run or a failed deploy is not missed. It checks
# out no code and only reads the finished run's name, link, commit and steps.
# The issue is assigned to the repository owner: GitHub then emails every new
# comment to the owner as a "participating" notification, which reaches them
# even when they do not watch the repository. If that assignment fails, this
# run fails after posting the alert, so the gap shows.
# Close the issue once the cause is fixed; the next failure opens a new one.
on:
  # Reads only the finished run's metadata; no code is checked out or run.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - CI
      - Deploy
      - Foundation native
      - E2E foundation
      # Advisory (its job continues on error): alerts only if the workflow
      # itself breaks, never for launch-configuration test failures.
      - E2E launch config
      - Synthetic Monitoring
      - Security Scan
      - Database Backup
      - Backup freshness
      - Main deployed
      - CodeQL Security Analysis
      - OpenSSF Scorecard
      - Staging keep-alive
    types: [completed]
    # Every completed run of a watched workflow starts this one, and GitHub
    # lists it as a skipped run when the job's condition is false. Pull request
    # and feature-branch runs can never raise an alert, so they do not start it.
    # Scheduled runs use the default branch (main), so they still do.
    branches: [main]

permissions: {}

# No concurrency group: a group holds only one waiting run, so alerts that
# finish close together could be dropped. Two alerts at the same moment can at
# worst post two comments (or, with no issue open, two issues).

jobs:
  alert:
    name: Open or update the failure alert
    # Pull request runs are excluded: their failures show on the pull request.
    # A scheduled run that was cancelled (for example by its time limit) or
    # could not start did not do its job either, so it alerts too, as does a
    # cancelled Deploy (the script below decides whether it had begun).
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'startup_failure' ||
      (github.event.workflow_run.conclusion == 'cancelled' &&
      (github.event.workflow_run.event == 'schedule' ||
      github.event.workflow_run.name == 'Deploy'))) &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'schedule' ||
      (github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_run')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      # Reads the steps of a failed or cancelled deploy.
      actions: read
    steps:
      - name: Open or update the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          title="Automated alert: a main or scheduled workflow run failed"
          marker="Workflow: $WORKFLOW"
          jobs_url="repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100"

          # A deploy that stopped only because main moved on while it waited or
          # ran is not a fault: the deploy of the newer main follows it. The
          # "Main deployed" check alerts if main is still not live hours later.
          # Any other failed step, or an unreadable run, still alerts.
          if [ "$WORKFLOW" = "Deploy" ] && [ "$CONCLUSION" = "failure" ]; then
            failed="$(gh api "$jobs_url" \
              --jq '.jobs[] | select(.conclusion == "failure") | if ([.steps[]? | select(.conclusion == "failure")] | length) == 0 then "job \(.name) failed without a failed step" else (.steps[] | select(.conclusion == "failure") | .name) end')" || failed=""
            main="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" || main=""
            if [ -n "$failed" ] && [ -n "$main" ] && [ "$main" != "$HEAD_SHA" ] &&
              ! printf '%s\n' "$failed" | grep -Ev '^(Reject stale deployment sources|Recheck main immediately before)' >/dev/null; then
              echo "::notice::The deploy of $HEAD_SHA stopped because main moved on to $main; the newer deploy follows. No alert."
              exit 0
            fi
          fi

          # A deploy cancelled while it waited, or before the last check that
          # main had not moved, changed nothing in production; the "Main
          # deployed" check covers it. One cancelled after that check passed may
          # have left production half old and half new, so it alerts. An
          # unreadable run alerts too.
          if [ "$WORKFLOW" = "Deploy" ] && [ "$CONCLUSION" = "cancelled" ]; then
            started="$(gh api "$jobs_url" \
              --jq '[.jobs[] | select(.name == "deploy") | .steps[]? | select((.name | startswith("Recheck main immediately before")) and .conclusion == "success")] | length')" || started=1
            if [ "$started" = "0" ]; then
              echo "::notice::The deploy of $HEAD_SHA was cancelled before any production change. No alert."
              exit 0
            fi
          fi

          case "$WORKFLOW" in
            "Synthetic Monitoring") meaning="The live website check failed: the site may be down or broken for visitors." ;;
            "Database Backup") meaning="A database backup run did not finish." ;;
            "Backup freshness") meaning="No new database backup was stored in time, or scheduled jobs are about to pause." ;;
            "Deploy") meaning="A release did not finish; the live site may still run the previous version, or only part of the new one." ;;
            "Main deployed") meaning="The latest change on main has not reached the live site for hours." ;;
            *) meaning="An automated check failed." ;;
          esac
          body="$(printf '%s\n' \
            "$marker" \
            "What it means: $meaning" \
            "Result: $CONCLUSION" \
            "Trigger: $EVENT" \
            "Commit: $HEAD_SHA" \
            "Run: $RUN_URL (attempt $RUN_ATTEMPT)" \
            "" \
            "Open the run for the failed job and its log.")"

          number="$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")"
          if [ -z "$number" ]; then
            url="$(gh issue create --title "$title" --body "$body")"
            echo "Opened $url"
            number="${url##*/}"
          else
            # A failing monitor runs many times a day: one comment per
            # workflow every 6 hours is enough while the issue is open.
            since="$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
            recent="$(gh api "repos/$GH_REPO/issues/$number/comments?since=$since&per_page=100" --jq '.[].body')"
            if printf '%s\n' "$recent" | grep -Fxq -- "$marker"; then
              echo "Issue #$number already has a recent alert for $WORKFLOW; not commenting again."
            else
              gh issue comment "$number" --body "$body"
            fi
          fi

          # Assigning the owner is what makes GitHub email them. GitHub ignores
          # a login it cannot assign without an error, so the answer is checked.
          # The alert is already posted; a failed assignment fails this run.
          assignees="$(gh api -X POST "repos/$GH_REPO/issues/$number/assignees" \
            -f "assignees[]=$OWNER" --jq '.assignees[].login')" || assignees=""
          if ! printf '%s\n' "$assignees" | grep -Fxq -- "$OWNER"; then
            echo "::error title=Alert not assigned::Issue #$number could not be assigned to the repository owner, so GitHub may not email them about it."
            exit 1
          fi
