name: Failure alert

# Opens one GitHub issue (or comments on it while it is open) when a run on
# main or a scheduled run of a watched workflow fails, so a red nightly, a red
# main run outside the deploy gate or a failed deploy is not missed. It checks
# out no code and only reads the finished run's name, link and commit.
# Close the issue once the cause is fixed; the next failure opens a new one.
on:
  workflow_run:
    workflows:
      - CI
      - Deploy
      - Foundation native
      - E2E foundation
      - Synthetic Monitoring
      - Security Scan
      - Database Backup
      - CodeQL Security Analysis
      - OpenSSF Scorecard
    types: [completed]

permissions: {}

concurrency:
  group: failure-alert
  cancel-in-progress: false

jobs:
  alert:
    name: Open or update the failure alert
    # Pull request runs are excluded: their failures show on the pull request.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'schedule' ||
      (github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_run')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT: ${{ github.event.workflow_run.event }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          title="Automated alert: a main or scheduled workflow run failed"
          marker="Workflow: $WORKFLOW"
          body="$(printf '%s\n' \
            "$marker" \
            "Trigger: $EVENT" \
            "Commit: $HEAD_SHA" \
            "Run: $RUN_URL (attempt $RUN_ATTEMPT)" \
            "" \
            "Open the run for the failed job and its log.")"
          number="$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")"
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body "$body"
            exit 0
          fi
          # A failing monitor runs many times a day: one comment per workflow
          # every 6 hours is enough while the issue is open.
          since="$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          recent="$(gh api "repos/$GH_REPO/issues/$number/comments?since=$since&per_page=100" --jq '.[].body')"
          if printf '%s\n' "$recent" | grep -Fxq -- "$marker"; then
            echo "Issue #$number already has a recent alert for $WORKFLOW; not commenting again."
            exit 0
          fi
          gh issue comment "$number" --body "$body"
