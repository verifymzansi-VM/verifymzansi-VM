name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: "production"
        type: choice
        options:
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip if triggered by CI workflow that failed
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    env:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.APP_URL }}
      AFRICASTALKING_API_KEY: ${{ secrets.AFRICASTALKING_API_KEY }}
      AFRICASTALKING_USERNAME: ${{ secrets.AFRICASTALKING_USERNAME }}
      AFRICASTALKING_SENDER_ID: ${{ secrets.AFRICASTALKING_SENDER_ID }}
      PAYFAST_MERCHANT_ID: ${{ secrets.PAYFAST_MERCHANT_ID }}
      PAYFAST_MERCHANT_KEY: ${{ secrets.PAYFAST_MERCHANT_KEY }}
      PAYFAST_PASSPHRASE: ${{ secrets.PAYFAST_PASSPHRASE }}
      PAYFAST_SANDBOX: "false"
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BUCKET: verifymzansi-public
      R2_PRIVATE_BUCKET: verifymzansi-private
      KYC_ENCRYPTION_KEY: ${{ secrets.KYC_ENCRYPTION_KEY }}
      ID_ENCRYPTION_KEY: ${{ secrets.ID_ENCRYPTION_KEY }}
      HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
      IP_HASH_SECRET: ${{ secrets.IP_HASH_SECRET }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Validate production launch env
        run: pnpm exec tsx scripts/validate-launch-env.ts --mode=production
      - name: Build for Cloudflare
        run: pnpm run build:cloudflare

      - name: Annotate known Cloudflare warning classes
        run: |
          echo "::notice::Known warning classes on the current Cloudflare/OpenNext path: Durable Object startup warnings from wrangler.toml, the Next.js 16 middleware deprecation for src/middleware.ts, and generated duplicate-object-key warnings from .open-next/server-functions."
          echo "::notice::Treat new warning patterns outside those classes as actionable."

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec opennextjs-cloudflare deploy

      - name: Deploy Rate Limiter Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.rate-limiter.toml

      - name: Deploy KYC Encryptor Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.kyc-encryptor.toml

      - name: Deploy Retention Cleanup Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.retention-cleanup.toml

      - name: Post-deploy health check
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL is required for the post-deploy health check"
            exit 1
          fi
          echo "Waiting for deployment to propagate..."
          sleep 30
          HTTP_CODE=$(curl -s -o /tmp/health_body.txt -w "%{http_code}" "${APP_URL}/api/health" 2>/dev/null) || HTTP_CODE="000"
          BODY=$(cat /tmp/health_body.txt 2>/dev/null || echo "")
          if [ "$HTTP_CODE" = "000" ]; then
            echo "::error::Health check failed: endpoint unreachable"
            exit 1
          elif [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health check returned HTTP ${HTTP_CODE}: ${BODY:0:200}"
            exit 1
          else
            STATUS=$(echo "$BODY" | jq -r '.status' 2>/dev/null) || STATUS=""
            CONFIG_STATUS=$(echo "$BODY" | jq -r '.checks.config.status' 2>/dev/null) || CONFIG_STATUS=""
            SUPABASE_STATUS=$(echo "$BODY" | jq -r '.checks.supabase.status' 2>/dev/null) || SUPABASE_STATUS=""
            if [ "$STATUS" = "ok" ] && [ "$CONFIG_STATUS" = "ok" ] && [ "$SUPABASE_STATUS" != "degraded" ]; then
              echo "Health check passed."
            else
              echo "::error::Health check returned a degraded body: ${BODY:0:400}"
              exit 1
            fi
          fi
