name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: "production"
        type: choice
        options:
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip if triggered by CI workflow that failed
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    env:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.APP_URL }}
      AFRICASTALKING_API_KEY: ${{ secrets.AFRICASTALKING_API_KEY }}
      AFRICASTALKING_USERNAME: ${{ secrets.AFRICASTALKING_USERNAME }}
      AFRICASTALKING_SENDER_ID: ${{ secrets.AFRICASTALKING_SENDER_ID }}
      OZOW_ENV: ${{ secrets.OZOW_ENV }}
      OZOW_CLIENT_ID: ${{ secrets.OZOW_CLIENT_ID }}
      OZOW_CLIENT_SECRET: ${{ secrets.OZOW_CLIENT_SECRET }}
      OZOW_SITE_CODE: ${{ secrets.OZOW_SITE_CODE }}
      OZOW_WEBHOOK_SECRET: ${{ secrets.OZOW_WEBHOOK_SECRET }}
      KYC_WEBHOOK_SECRET: ${{ secrets.KYC_WEBHOOK_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BUCKET: verifymzansi-public
      R2_PRIVATE_BUCKET: verifymzansi-private
      KYC_ENCRYPTION_KEY: ${{ secrets.KYC_ENCRYPTION_KEY }}
      ID_ENCRYPTION_KEY: ${{ secrets.ID_ENCRYPTION_KEY }}
      HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
      IP_HASH_SECRET: ${{ secrets.IP_HASH_SECRET }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Secret scan
        run: pnpm run secret-scan
      - name: Security audit
        run: pnpm run security:audit
      - name: License policy check
        run: pnpm run licenses:check
      - name: Validate production launch env
        run: pnpm exec tsx scripts/validate-launch-env.ts --mode=production
      - name: Enforce production Ozow mode
        run: |
          if [ -z "$OZOW_ENV" ]; then
            echo "::error::OZOW_ENV is required for production deploys"
            exit 1
          fi
          if [ "$OZOW_ENV" != "production" ]; then
            echo "::error::OZOW_ENV must be 'production' for production deploys (received '$OZOW_ENV')"
            exit 1
          fi
      - name: Validate required public build envs
        run: |
          FAILED=0
          for var in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::${var} must be set for the production client bundle"
              FAILED=1
            fi
          done
          for var in NEXT_PUBLIC_APP_URL NEXT_PUBLIC_TURNSTILE_SITE_KEY; do
            if [ -z "${!var}" ]; then
              echo "::warning::${var} is not set — using defaults"
            fi
          done
          exit $FAILED
      - name: Run production preflight
        run: pnpm run preflight:prod
      - name: Verify database schema invariants
        run: pnpm run db:verify-schema
      - name: Build for Cloudflare
        run: pnpm run build:cloudflare

      - name: Annotate known Cloudflare warning classes
        run: |
          echo "::notice::Known warning classes on the current Cloudflare/OpenNext path: Durable Object startup warnings from wrangler.toml and generated duplicate-object-key warnings from .open-next/server-functions."
          echo "::notice::Treat new warning patterns outside those classes as actionable."

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec opennextjs-cloudflare deploy

      - name: Deploy Rate Limiter Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.rate-limiter.toml

      - name: Deploy KYC Encryptor Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.kyc-encryptor.toml

      - name: Deploy Retention Cleanup Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.retention-cleanup.toml

      - name: Post-deploy health check
        id: health-check
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DEPLOY_HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL is required for the post-deploy health check"
            exit 1
          fi

          HEALTHCHECK_URL="$DEPLOY_HEALTHCHECK_URL"
          if [ -z "$HEALTHCHECK_URL" ]; then
            HEALTHCHECK_URL="${APP_URL%/}/api/health"
            echo "::notice::Using default health check URL derived from APP_URL"
          else
            echo "::notice::Using DEPLOY_HEALTHCHECK_URL override"
          fi

          echo "Waiting for deployment to propagate..."
          sleep 30
          HTTP_CODE=$(curl -s -L -A "VerifyMzansi-Deploy-Healthcheck/1.0" -H "Accept: application/json" -o /tmp/health_body.txt -w "%{http_code}" "$HEALTHCHECK_URL" 2>/dev/null) || HTTP_CODE="000"
          BODY=$(cat /tmp/health_body.txt 2>/dev/null || echo "")
          if [ "$HTTP_CODE" = "000" ]; then
            echo "::error::Health check failed: endpoint unreachable"
            exit 1
          elif [ "$HTTP_CODE" = "403" ] && echo "$BODY" | grep -qi "just a moment"; then
            if [ -n "$DEPLOY_HEALTHCHECK_URL" ]; then
              echo "::error::DEPLOY_HEALTHCHECK_URL appears to be behind a Cloudflare challenge. Point it to a challenge-free health endpoint."
              exit 1
            fi
            echo "::warning::Health check endpoint is protected by Cloudflare challenge. Skipping curl health gate and relying on post-deploy browser verification."
            exit 0
          elif [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health check returned HTTP ${HTTP_CODE}: ${BODY:0:200}"
            exit 1
          else
            STATUS=$(echo "$BODY" | jq -r '.status' 2>/dev/null) || STATUS=""
            CONFIG_STATUS=$(echo "$BODY" | jq -r '.checks.config.status' 2>/dev/null) || CONFIG_STATUS=""
            SUPABASE_STATUS=$(echo "$BODY" | jq -r '.checks.supabase.status' 2>/dev/null) || SUPABASE_STATUS=""
            SCHEMA_STATUS=$(echo "$BODY" | jq -r '.checks.schema.status' 2>/dev/null) || SCHEMA_STATUS=""
            if [ "$STATUS" = "ok" ] && [ "$CONFIG_STATUS" = "ok" ] && [ "$SUPABASE_STATUS" != "degraded" ] && [ "$SCHEMA_STATUS" != "degraded" ]; then
              echo "Health check passed."
            else
              echo "::error::Health check returned a degraded body: ${BODY:0:400}"
              exit 1
            fi
          fi

      - name: Rollback main worker on health check failure
        if: failure() && steps.health-check.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::warning::Health check failed — rolling back main worker to previous deployment"
          pnpm exec wrangler rollback --message "Auto-rollback: health check failed" || echo "::error::Rollback failed — manual intervention required"

      - name: Install Chromium for post-deploy verification
        run: npx playwright install --with-deps chromium

      - name: Verify public/auth pages in a real browser
        env:
          PUBLIC_VERIFY_BASE_URL: ${{ secrets.APP_URL }}
          PUBLIC_VERIFY_REQUIRE_TURNSTILE: "1"
          PUBLIC_VERIFY_ALLOW_CLOUDFLARE_CHALLENGE: "1"
        run: pnpm run test:public-verify

      - name: Upload safety gate artifacts (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-safety-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/safety-gate/**
          if-no-files-found: ignore
