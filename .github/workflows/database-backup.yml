name: Database Backup

# Twice-daily encrypted backup of the production Supabase database (the Free
# plan keeps no restorable backups). Each run dumps roles, schema and data with
# the Supabase CLI, checks the dump, records per-table row counts and the
# foundation schema fingerprint, encrypts everything to the public key in
# .github/backup/ and uploads it to the private R2 bucket
# `verifymzansi-backups`, which deletes copies after 35 days.
#
# Only the owner's offline private key can decrypt a backup. This repository
# is public, so this job never prints, caches or uploads unencrypted data as
# an artifact; its log shows only sizes, counts, hashes and times. Restore
# steps: docs/RUNBOOK.md, "Database backups". backup-freshness.yml alerts when
# no new backup has been stored for 27 hours.

on:
  schedule:
    # Scheduled runs here start 3 to 5.5 hours after the cron time (GitHub
    # queue delay). Two runs 12 hours apart keep the gap between stored backups
    # near 12 to 14.5 hours, so one missed run still stays close to the 24-hour
    # recovery point. Off-the-hour minutes avoid GitHub's top-of-hour peak.
    - cron: "47 20 * * *" # 22:47 SAST; usually runs between 02:00 and 04:30 SAST
    - cron: "47 8 * * *" # 10:47 SAST; usually runs between 14:00 and 16:30 SAST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    # The extras after the main dump (platform dumps, row counts, fingerprint)
    # are capped at 5 + 5 + 7 minutes by `timeout`, so even if every one of
    # them hangs, at least 28 minutes remain for the main dump, encryption and
    # upload, which normally take a few minutes in total.
    timeout-minutes: 45
    # Backup credentials belong in the protected "backup" environment
    # (deployment branch: main only), which the deploy jobs cannot read, with
    # a storage token limited to the backup bucket instead of the app's own
    # storage key. Until the owner creates it, GitHub creates it empty and
    # unprotected on the first run and the repository-level copies resolve.
    environment: backup
    env:
      SUPABASE_PROJECT_REF: gntzjtuncsyefujajmjy
      SUPABASE_POOLER_HOST: aws-0-eu-west-2.pooler.supabase.com
      BACKUP_SCHEMAS: api,private,internal,public,auth,extensions
      # Supabase-managed schemas the app depends on, kept in their own files
      # (see "Dump the Supabase platform schemas").
      PLATFORM_SCHEMAS: realtime,supabase_migrations
      BACKUP_BUCKET: verifymzansi-backups
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installed before the connection string exists, so this third-party
      # action never sees it.
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.120.0

      # The connection string goes into a private file that only the three
      # steps needing it read, not into GITHUB_ENV (which every later step,
      # the heartbeat included, would inherit); it is deleted after the last.
      - name: Build the database connection string
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_BACKUP_DB_PASSWORD }}
        run: |
          # Pasting into the GitHub secret form can add a trailing newline.
          DB_PASSWORD=$(printf '%s' "$DB_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -z "$DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_BACKUP_DB_PASSWORD to the backup environment (Supabase > Project Settings > Database password)."
            exit 1
          fi
          encoded=$(DB_PASSWORD="$DB_PASSWORD" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""))')
          echo "::add-mask::$encoded"
          # Session mode (port 5432) supports pg_dump; the transaction pooler does not.
          umask 077
          printf '%s' "postgresql://postgres.${SUPABASE_PROJECT_REF}:${encoded}@${SUPABASE_POOLER_HOST}:5432/postgres" \
            > "$RUNNER_TEMP/db-url"

      - name: Dump roles, schema and data
        run: |
          DB_URL=$(cat "$RUNNER_TEMP/db-url")
          mkdir -p "$RUNNER_TEMP/backup"
          cd "$RUNNER_TEMP/backup"
          echo "DUMP_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          supabase db dump --db-url "$DB_URL" -f roles.sql --role-only
          supabase db dump --db-url "$DB_URL" --schema "$BACKUP_SCHEMAS" -f schema.sql
          supabase db dump --db-url "$DB_URL" --schema "$BACKUP_SCHEMAS" -f data.sql --use-copy --data-only

      # realtime holds the owner_inbox_receive policy on realtime.messages (the
      # owner inbox's live updates); supabase_migrations holds the hosted
      # migration ledger. Both are Supabase-managed, and a new project already
      # has its own copies, so they stay out of schema.sql and data.sql (whose
      # restore must not collide with them) and go into platform-*.sql for a
      # selective restore. Realtime rows are transient broadcasts and session
      # state that Supabase recreates, so only its schema is kept. storage and
      # vault stay out: the app keeps files in R2 and stores no Vault secrets.
      # A failure here, or a dump running over 5 minutes, is recorded and
      # fails the run only after the main backup is stored ("Fail if part of
      # the backup is missing").
      - name: Dump the Supabase platform schemas
        run: |
          DB_URL=$(cat "$RUNNER_TEMP/db-url")
          cd "$RUNNER_TEMP/backup"
          status=complete
          if ! timeout -k 30 300 supabase db dump --db-url "$DB_URL" --schema "$PLATFORM_SCHEMAS" -f platform-schema.sql; then
            status="platform schema dump failed or timed out"
          elif ! grep -Eq '^CREATE POLICY "owner_inbox_receive" ON "realtime"\."messages" ' platform-schema.sql; then
            status="platform-schema.sql is missing the owner_inbox_receive policy"
          elif ! timeout -k 30 300 supabase db dump --db-url "$DB_URL" --schema supabase_migrations -f platform-data.sql --use-copy --data-only; then
            status="migration ledger dump failed or timed out"
          elif ! grep -Eq '^COPY "supabase_migrations"\."schema_migrations" ' platform-data.sql; then
            status="platform-data.sql has no migration ledger"
          fi
          if [ "$status" != complete ]; then
            echo "::error::Platform schemas not fully backed up: ${status}. The main backup continues."
            echo "$status" >> problems.txt
          fi
          echo "PLATFORM_DUMP=${status}" >> "$GITHUB_ENV"
          echo "DUMP_FINISHED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Check the dump is complete
        run: |
          cd "$RUNNER_TEMP/backup"
          for file in roles.sql schema.sql data.sql; do
            if [ ! -s "$file" ]; then
              echo "::error::$file is empty"
              exit 1
            fi
          done
          # The foundation keeps application rows in private, including empty
          # tables. Auth must be explicitly included rather than silently omitted.
          for table in 'auth"?\."?users' 'private"?\."?profiles' 'private"?\."?posts' 'private"?\."?payments' 'private"?\."?evidence_cases'; do
            if ! grep -Eq "^COPY \"?${table}\"? " data.sql; then
              echo "::error::data.sql has no data section for ${table}"
              exit 1
            fi
          done
          grep -Eq 'CREATE TABLE (IF NOT EXISTS )?"?private"?\."?profiles"?' schema.sql \
            || { echo "::error::schema.sql is missing private.profiles"; exit 1; }
          grep -Eq 'CREATE (OR REPLACE )?FUNCTION "?api"?\."?get_my_billing"?\(' schema.sql \
            || { echo "::error::schema.sql is missing the foundation runtime API"; exit 1; }
          files=(roles.sql schema.sql data.sql)
          for extra in platform-schema.sql platform-data.sql; do
            if [ -f "$extra" ]; then files+=("$extra"); fi
          done
          ls -l "${files[@]}" | awk '{print $5, $9}'

      # Proof of completeness for a restore drill, kept inside the encrypted
      # archive: exact row counts per table, read from the live database just
      # after the dump and counted again from the dump itself, plus the
      # foundation schema fingerprint (database/foundation/fingerprint.sql, as
      # compared in fingerprint.json productionCheck). One read-only
      # transaction; only numbers and catalogue hashes, never row contents.
      # Live and dump counts can differ by rows written during the dump.
      - name: Record row counts and the schema fingerprint
        env:
          # The pooler accepts TLS; never let psql fall back to plain text.
          PGSSLMODE: require
          # Bounded: 15 s to connect, 3 min per query and 10 s per lock wait in
          # backup-manifest.sql, and 7 min in all through `timeout` below.
          PGCONNECT_TIMEOUT: "15"
          APP_SCHEMAS: api,private,internal,public
        run: |
          DB_URL=$(cat "$RUNNER_TEMP/db-url")
          cd "$RUNNER_TEMP/backup"
          echo "COUNTS_CAPTURED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          # Every failure below is recorded, not fatal: the main backup must
          # still be encrypted and stored, and the run fails after the upload.
          problem() {
            echo "::error::${1}"
            echo "$1" >> problems.txt
          }
          tools="$GITHUB_WORKSPACE/.github/backup"
          if ! command -v psql > /dev/null; then
            problem "row counts and fingerprint not recorded (no psql on the runner)"
            exit 0
          fi
          if ! timeout -k 30 420 psql "$DB_URL" --no-psqlrc --quiet -v schemas="${BACKUP_SCHEMAS},supabase_migrations" \
              -f "$tools/backup-manifest.sql"; then
            problem "row counts and fingerprint not recorded (query failed or timed out)"
            rm -f row-counts-live.tsv fingerprint.tsv
            exit 0
          fi
          dumps=(data.sql)
          if [ -f platform-data.sql ]; then dumps+=(platform-data.sql); fi
          gaps=0
          why=""
          # errexit does not apply inside an `if` condition, so each command
          # returns explicitly.
          summarise() {
            why="no live row counts were returned"
            [ -s row-counts-live.tsv ] || return 1
            why="the dump could not be counted"
            awk -f "$tools/dump-row-counts.awk" "${dumps[@]}" > row-counts-dump.tsv || return 1
            why="the counts could not be merged"
            awk -v app_schemas="$APP_SCHEMAS" -v gaps_file=row-count-gaps.txt \
              -f "$tools/merge-row-counts.awk" row-counts-dump.tsv row-counts-live.tsv > ROW-COUNTS.tsv || return 1
            read -r gaps < row-count-gaps.txt || return 1
            why="no fingerprint was returned"
            [ -s fingerprint.tsv ] || return 1
            mv fingerprint.tsv FINGERPRINT.tsv || return 1
          }
          if ! summarise; then
            problem "row counts and fingerprint not recorded (${why})"
            rm -f ROW-COUNTS.tsv FINGERPRINT.tsv fingerprint.tsv
            gaps=0
          fi
          rm -f row-counts-live.tsv row-counts-dump.tsv row-count-gaps.txt
          # Only the number reaches the log; ROW-COUNTS.tsv names the tables.
          if [ "$gaps" != 0 ]; then
            problem "${gaps} table(s) in ${APP_SCHEMAS} missing from the dump, unreadable or short of rows (see ROW-COUNTS.tsv)"
          fi
          if [ -f FINGERPRINT.tsv ]; then
            echo "Schema fingerprint (category, items, md5):"
            if ! cat FINGERPRINT.tsv; then problem "fingerprint could not be printed"; fi
          fi

      # Nothing after this point connects to the database.
      - name: Forget the connection string
        if: always()
        run: rm -f "$RUNNER_TEMP/db-url"

      - name: Write the manifest
        run: |
          cd "$RUNNER_TEMP/backup"
          files=(roles.sql schema.sql data.sql)
          for extra in platform-schema.sql platform-data.sql ROW-COUNTS.tsv FINGERPRINT.tsv; do
            if [ -f "$extra" ]; then files+=("$extra"); fi
          done
          {
            echo "project: ${SUPABASE_PROJECT_REF}"
            echo "backend: foundation"
            echo "schemas: ${BACKUP_SCHEMAS}"
            echo "platform_schemas: ${PLATFORM_SCHEMAS} (${PLATFORM_DUMP})"
            echo "dump_started_utc: ${DUMP_STARTED_UTC}"
            echo "dump_finished_utc: ${DUMP_FINISHED_UTC}"
            echo "counts_captured_utc: ${COUNTS_CAPTURED_UTC}"
            echo "created_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "supabase_cli: $(supabase --version)"
            echo "psql: $(psql --version 2>/dev/null || echo none)"
            echo "commit: ${GITHUB_SHA}"
            if [ -s problems.txt ]; then sed 's/^/problem: /' problems.txt; fi
            sha256sum "${files[@]}"
          } > MANIFEST.txt
          printf '%s\n' MANIFEST.txt "${files[@]}" > archive-files.txt

      - name: Encrypt the backup
        run: |
          # A failed tar must fail the run, not encrypt a truncated archive.
          set -o pipefail
          cd "$RUNNER_TEMP/backup"
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          name="verifymzansi-db-${stamp}.tar.gz.gpg"
          tar -czf - --files-from archive-files.txt \
            | gpg --batch --quiet --trust-model always \
                --recipient-file "$GITHUB_WORKSPACE/.github/backup/database-backup-public-key.asc" \
                --output "$name" --encrypt
          echo "BACKUP_FILE=$RUNNER_TEMP/backup/$name" >> "$GITHUB_ENV"
          echo "BACKUP_KEY=database/$(date -u +%Y/%m/%d)/$name" >> "$GITHUB_ENV"
          # A shred failure must not stop the encrypted copy being stored: it
          # is recorded and fails the run after the upload. The runner is
          # discarded after the job either way.
          if ! xargs shred -u < archive-files.txt; then
            echo "::error::Plaintext backup files could not be shredded; deleting them instead."
            echo "plaintext files could not be shredded" >> problems.txt
            if ! xargs rm -f < archive-files.txt; then
              echo "plaintext files could not be deleted" >> problems.txt
            fi
          fi

      - name: Upload to the private R2 bucket
        env:
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          # Transitional: the app's storage key, used only until the backup
          # bucket's own token exists. It is never placed in the backup
          # environment, so it stops resolving once removed from the repository.
          LEGACY_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          LEGACY_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          # The bucket-scoped token when set; until then the app's storage key
          # (repository-level only, so it stops resolving once moved), with a
          # warning on every run.
          if [ -n "$BACKUP_R2_ACCESS_KEY_ID" ] || [ -n "$BACKUP_R2_SECRET_ACCESS_KEY" ]; then
            if [ -z "$BACKUP_R2_ACCESS_KEY_ID" ] || [ -z "$BACKUP_R2_SECRET_ACCESS_KEY" ]; then
              echo "::error::Set both BACKUP_R2_ACCESS_KEY_ID and BACKUP_R2_SECRET_ACCESS_KEY in the backup environment."
              exit 1
            fi
            export AWS_ACCESS_KEY_ID="$BACKUP_R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$BACKUP_R2_SECRET_ACCESS_KEY"
          elif [ -n "$LEGACY_R2_ACCESS_KEY_ID" ] && [ -n "$LEGACY_R2_SECRET_ACCESS_KEY" ]; then
            export AWS_ACCESS_KEY_ID="$LEGACY_R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$LEGACY_R2_SECRET_ACCESS_KEY"
            echo "::warning::Backups still use the app's storage key. Create a token limited to the ${BACKUP_BUCKET} bucket and set BACKUP_R2_ACCESS_KEY_ID and BACKUP_R2_SECRET_ACCESS_KEY in the backup environment."
          else
            echo "::error::Set BACKUP_R2_ACCESS_KEY_ID and BACKUP_R2_SECRET_ACCESS_KEY in the backup environment."
            exit 1
          fi
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "$BACKUP_FILE" "s3://${BACKUP_BUCKET}/${BACKUP_KEY}" \
            --endpoint-url "$endpoint" --only-show-errors
          local_size=$(stat -c %s "$BACKUP_FILE")
          remote_size=$(aws s3api head-object --bucket "$BACKUP_BUCKET" --key "$BACKUP_KEY" \
            --endpoint-url "$endpoint" --query ContentLength --output text)
          if [ "$local_size" != "$remote_size" ]; then
            echo "::error::Uploaded size ${remote_size} does not match local size ${local_size}"
            exit 1
          fi
          echo "Stored ${BACKUP_KEY} (${local_size} bytes, encrypted)"

      # The stored backup is usable, but a part the earlier steps could not
      # capture must still turn the run red and reach the failure alert.
      - name: Fail if part of the backup is missing
        run: |
          problems="$RUNNER_TEMP/backup/problems.txt"
          if [ -s "$problems" ]; then
            while IFS= read -r problem; do echo "::error::${problem}"; done < "$problems"
            exit 1
          fi
          echo "Every part of the backup was stored."

      # Optional dead man's switch: only a fully stored backup pings, so the
      # monitor alerts when backups stop. Unset = nothing is sent. The ping can
      # never fail the backup and its URL is never printed.
      - name: Report the stored backup to the heartbeat monitor
        continue-on-error: true
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL_DATABASE_BACKUP }}
        run: |
          if [ -z "$HEARTBEAT_URL" ]; then
            echo "No backup heartbeat is configured."
            exit 0
          fi
          code=$(curl --silent --proto '=https' --max-time 10 --retry 2 --output /dev/null \
            --write-out '%{http_code}' "$HEARTBEAT_URL" 2>/dev/null) || code=000
          case "$code" in
            2??) echo "Backup heartbeat sent." ;;
            *) echo "::warning::The backup heartbeat was not accepted (HTTP ${code})." ;;
          esac
