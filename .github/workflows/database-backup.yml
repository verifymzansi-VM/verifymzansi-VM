name: Database Backup

# Nightly encrypted backup of the production Supabase database (the Free plan
# keeps no restorable backups). Each run dumps roles, schema and data with the
# Supabase CLI, checks the dump, encrypts it to the public key in
# .github/backup/ and uploads it to the private R2 bucket
# `verifymzansi-backups`, which deletes copies after 35 days.
#
# Only the owner's offline private key can decrypt a backup. This repository
# is public, so this job never prints, caches or uploads unencrypted data as
# an artifact. Restore steps: docs/RUNBOOK.md, "Database backups".

on:
  schedule:
    # 23:30 UTC = 01:30 in South Africa.
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Backup credentials live in the protected "backup" environment (main
    # only), which no other workflow can read, with a storage token limited
    # to the backup bucket instead of the app's own storage key.
    environment: backup
    env:
      SUPABASE_PROJECT_REF: gntzjtuncsyefujajmjy
      SUPABASE_POOLER_HOST: aws-0-eu-west-2.pooler.supabase.com
      BACKUP_SCHEMAS: api,private,internal,public,auth,extensions
      BACKUP_BUCKET: verifymzansi-backups
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      # The connection string is built inside this step and never written to
      # $GITHUB_ENV, so no other step (or third-party action) can read it.
      # The pinned CLI dumps as role "postgres", so this still uses the
      # postgres password; a dedicated read-only login needs a direct pg_dump
      # path and is introduced with the restore drill.
      - name: Dump roles, schema and data
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_BACKUP_DB_PASSWORD }}
        run: |
          # Pasting into the GitHub secret form can add a trailing newline.
          DB_PASSWORD=$(printf '%s' "$DB_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -z "$DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_BACKUP_DB_PASSWORD to the backup environment (Supabase > Project Settings > Database password)."
            exit 1
          fi
          encoded=$(DB_PASSWORD="$DB_PASSWORD" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""))')
          echo "::add-mask::$encoded"
          # Session mode (port 5432) supports pg_dump; the transaction pooler does not.
          DB_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${encoded}@${SUPABASE_POOLER_HOST}:5432/postgres"
          mkdir -p "$RUNNER_TEMP/backup"
          cd "$RUNNER_TEMP/backup"
          supabase db dump --db-url "$DB_URL" -f roles.sql --role-only
          supabase db dump --db-url "$DB_URL" --schema "$BACKUP_SCHEMAS" -f schema.sql
          supabase db dump --db-url "$DB_URL" --schema "$BACKUP_SCHEMAS" -f data.sql --use-copy --data-only

      - name: Check the dump is complete
        run: |
          cd "$RUNNER_TEMP/backup"
          for file in roles.sql schema.sql data.sql; do
            if [ ! -s "$file" ]; then
              echo "::error::$file is empty"
              exit 1
            fi
          done
          # The foundation keeps application rows in private, including empty
          # tables. Auth must be explicitly included rather than silently omitted.
          for table in 'auth"?\."?users' 'private"?\."?profiles' 'private"?\."?posts' 'private"?\."?payments' 'private"?\."?evidence_cases'; do
            if ! grep -Eq "^COPY \"?${table}\"? " data.sql; then
              echo "::error::data.sql has no data section for ${table}"
              exit 1
            fi
          done
          grep -Eq 'CREATE TABLE (IF NOT EXISTS )?"?private"?\."?profiles"?' schema.sql \
            || { echo "::error::schema.sql is missing private.profiles"; exit 1; }
          grep -Eq 'CREATE (OR REPLACE )?FUNCTION "?api"?\."?get_my_billing"?\(' schema.sql \
            || { echo "::error::schema.sql is missing the foundation runtime API"; exit 1; }
          {
            echo "project: ${SUPABASE_PROJECT_REF}"
            echo "backend: foundation"
            echo "schemas: ${BACKUP_SCHEMAS}"
            echo "created_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "supabase_cli: $(supabase --version)"
            echo "commit: ${GITHUB_SHA}"
            sha256sum roles.sql schema.sql data.sql
          } > MANIFEST.txt
          ls -l roles.sql schema.sql data.sql | awk '{print $5, $9}'

      - name: Encrypt the backup
        run: |
          # A failed tar must fail the run, not encrypt a truncated archive.
          set -o pipefail
          cd "$RUNNER_TEMP/backup"
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          name="verifymzansi-db-${stamp}.tar.gz.gpg"
          tar -czf - MANIFEST.txt roles.sql schema.sql data.sql \
            | gpg --batch --quiet --trust-model always \
                --recipient-file "$GITHUB_WORKSPACE/.github/backup/database-backup-public-key.asc" \
                --output "$name" --encrypt
          shred -u roles.sql schema.sql data.sql
          echo "BACKUP_FILE=$RUNNER_TEMP/backup/$name" >> "$GITHUB_ENV"
          echo "BACKUP_KEY=database/$(date -u +%Y/%m/%d)/$name" >> "$GITHUB_ENV"

      - name: Upload to the private R2 bucket
        env:
          BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          # Transitional: the app's storage key, used only until the backup
          # bucket's own token exists. It is never placed in the backup
          # environment, so it stops resolving once removed from the repository.
          LEGACY_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          LEGACY_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -n "$BACKUP_R2_ACCESS_KEY_ID" ] || [ -n "$BACKUP_R2_SECRET_ACCESS_KEY" ]; then
            if [ -z "$BACKUP_R2_ACCESS_KEY_ID" ] || [ -z "$BACKUP_R2_SECRET_ACCESS_KEY" ]; then
              echo "::error::Set both BACKUP_R2_ACCESS_KEY_ID and BACKUP_R2_SECRET_ACCESS_KEY in the backup environment."
              exit 1
            fi
            export AWS_ACCESS_KEY_ID="$BACKUP_R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$BACKUP_R2_SECRET_ACCESS_KEY"
          elif [ -n "$LEGACY_R2_ACCESS_KEY_ID" ] && [ -n "$LEGACY_R2_SECRET_ACCESS_KEY" ]; then
            export AWS_ACCESS_KEY_ID="$LEGACY_R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$LEGACY_R2_SECRET_ACCESS_KEY"
            echo "::warning::Backups still use the app's storage key. Create a token limited to the ${BACKUP_BUCKET} bucket and set BACKUP_R2_ACCESS_KEY_ID and BACKUP_R2_SECRET_ACCESS_KEY."
          else
            echo "::error::Set BACKUP_R2_ACCESS_KEY_ID and BACKUP_R2_SECRET_ACCESS_KEY in the backup environment."
            exit 1
          fi
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "$BACKUP_FILE" "s3://${BACKUP_BUCKET}/${BACKUP_KEY}" \
            --endpoint-url "$endpoint" --only-show-errors
          local_size=$(stat -c %s "$BACKUP_FILE")
          remote_size=$(aws s3api head-object --bucket "$BACKUP_BUCKET" --key "$BACKUP_KEY" \
            --endpoint-url "$endpoint" --query ContentLength --output text)
          if [ "$local_size" != "$remote_size" ]; then
            echo "::error::Uploaded size ${remote_size} does not match local size ${local_size}"
            exit 1
          fi
          echo "Stored ${BACKUP_KEY} (${local_size} bytes, encrypted)"

      # Optional dead man's switch: only a fully stored backup pings, so the
      # monitor alerts when backups stop. Unset = nothing is sent. The ping can
      # never fail the backup and its URL is never printed.
      - name: Report the stored backup to the heartbeat monitor
        continue-on-error: true
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL_DATABASE_BACKUP }}
        run: |
          if [ -z "$HEARTBEAT_URL" ]; then
            echo "No backup heartbeat is configured."
            exit 0
          fi
          code=$(curl --silent --proto '=https' --max-time 10 --retry 2 --output /dev/null \
            --write-out '%{http_code}' "$HEARTBEAT_URL" 2>/dev/null) || code=000
          case "$code" in
            2??) echo "Backup heartbeat sent." ;;
            *) echo "::warning::The backup heartbeat was not accepted (HTTP ${code})." ;;
          esac
