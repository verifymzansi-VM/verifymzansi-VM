name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  lint-type-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run quality:openapi-drift
      - run: pnpm run depcruise
      - run: pnpm run db:check-invariants
      - run: pnpm run secret-scan:strict
      - run: pnpm run licenses:check
      - run: pnpm run security:audit

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Dead-code scan
        run: pnpm run knip

  jscpd-advisory:
    name: Duplication budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Code duplication budget
        run: pnpm run jscpd:check
      - name: Upload jscpd report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jscpd-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/jscpd/**
          if-no-files-found: warn

  unit-api-contract:
    runs-on: ubuntu-latest
    needs: lint-type-security
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Coverage gate
        env:
          STRICT_COVERAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: pnpm run test:coverage
      - name: Preflight (non-blocking in CI)
        run: pnpm run preflight || echo "::warning::Preflight checks failed (expected in CI without production secrets)"
      - run: pnpm run test:contract
      - name: Mutation canary checks
        run: pnpm run test:mutation

  build-route-verify:
    runs-on: ubuntu-latest
    needs: lint-type-security
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ (startsWith(secrets.NEXT_PUBLIC_SUPABASE_URL, 'https://') || startsWith(secrets.NEXT_PUBLIC_SUPABASE_URL, 'http://')) && secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build Next.js app
        run: pnpm run build
      - name: Verify critical payment routes in build
        run: |
          echo "Checking critical addon/payment routes exist in build output..."
          MISSING=0
          for route in \
            "api/listings/\\[id\\]/featured" \
            "api/listings/\\[id\\]/urgent" \
            "api/listings/\\[id\\]/boost" \
            "api/businesses/\\[id\\]/boost" \
            "api/billing/create-checkout"; do
            if ! find .next/server/app -path "*${route}*" -print -quit 2>/dev/null | grep -q .; then
              echo "::error::MISSING ROUTE: ${route} not found in production build"
              MISSING=$((MISSING + 1))
            else
              echo "✓ ${route}"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::${MISSING} critical route(s) missing from build. Failing CI."
            exit 1
          fi
          echo "All critical payment routes verified in build output."

  db-rls:
    runs-on: ubuntu-latest
    needs: lint-type-security
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Verify DB secrets are configured
        id: check-db-secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::DB/RLS tests require Supabase secrets. Configure NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and NEXT_PUBLIC_SUPABASE_ANON_KEY as repository secrets."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [[ ! "$SUPABASE_URL" =~ ^https?:// ]]; then
            echo "::warning::Skipping DB/RLS tests because NEXT_PUBLIC_SUPABASE_URL is not a valid http(s) URL."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: DB contract + RLS checks
        if: steps.check-db-secrets.outputs.skip != 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STRICT_DB_TESTS: "true"
        run: |
          pnpm run db:verify-schema
          pnpm run test:db

  e2e-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [unit-api-contract, build-route-verify]
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chrome]
    env:
      PLAYWRIGHT_TEST_MODE: "1"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "dummy_site_key"
      TURNSTILE_SECRET_KEY: "dummy_secret_key" # secret-scan: allow
      NEXT_PUBLIC_SUPABASE_URL: ${{ (startsWith(secrets.NEXT_PUBLIC_SUPABASE_URL, 'https://') || startsWith(secrets.NEXT_PUBLIC_SUPABASE_URL, 'http://')) && secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps
      - run: pnpm exec playwright test --grep "@smoke" --project ${{ matrix.project }}

  launch-flows-bundle:
    runs-on: ubuntu-latest
    needs: [unit-api-contract, build-route-verify]
    env:
      PLAYWRIGHT_TEST_MODE: "1"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "dummy_site_key"
      TURNSTILE_SECRET_KEY: "dummy_secret_key" # secret-scan: allow
      NEXT_PUBLIC_SUPABASE_URL: ${{ (startsWith(secrets.NEXT_PUBLIC_SUPABASE_URL, 'https://') || startsWith(secrets.NEXT_PUBLIC_SUPABASE_URL, 'http://')) && secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Billing + OTP + DSAR launch bundle
        run: pnpm run test:launch:flows

  e2e-full-matrix:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [e2e-smoke, launch-flows-bundle, db-rls]
    strategy:
      fail-fast: false
      matrix:
        # WebKit/mobile-safari are intentionally quarantined from the full push
        # matrix because the current suite already marks their page-navigation
        # coverage as unreliable under headless CI.
        project: [chromium, firefox, mobile-chrome]
    env:
      PLAYWRIGHT_TEST_MODE: "1"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "dummy_site_key"
      TURNSTILE_SECRET_KEY: "dummy_secret_key" # secret-scan: allow
      NEXT_PUBLIC_SUPABASE_URL: ${{ (startsWith(secrets.NEXT_PUBLIC_SUPABASE_URL, 'https://') || startsWith(secrets.NEXT_PUBLIC_SUPABASE_URL, 'http://')) && secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps
      - run: pnpm exec playwright test --project ${{ matrix.project }}

  perf-baseline:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: e2e-full-matrix
    steps:
      - name: Check staging URL is configured
        id: check-url
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "STAGING_APP_URL not set, skipping perf baseline"
          fi
        env:
          STAGING_URL: ${{ secrets.STAGING_APP_URL }}
      - uses: actions/checkout@v6
        if: steps.check-url.outputs.skip != 'true'
      - uses: pnpm/action-setup@v5
        if: steps.check-url.outputs.skip != 'true'
      - uses: actions/setup-node@v7
        if: steps.check-url.outputs.skip != 'true'
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
        if: steps.check-url.outputs.skip != 'true'
      - name: Run performance baseline check
        if: steps.check-url.outputs.skip != 'true'
        env:
          PERF_BASE_URL: ${{ secrets.STAGING_APP_URL }}
          PERF_REQUESTS: "80"
          PERF_CONCURRENCY: "8"
          PERF_P95_MS: "1200"
          PERF_MAX_ERROR_RATE: "0.01"
        run: pnpm run test:perf

  k6-advisory:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    needs: perf-baseline
    steps:
      - name: Check staging URL is configured
        id: check-url
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "STAGING_APP_URL not set, skipping k6 advisory"
          fi
        env:
          STAGING_URL: ${{ secrets.STAGING_APP_URL }}
      - uses: actions/checkout@v6
        if: steps.check-url.outputs.skip != 'true'
      - name: Run k6 advisory profile
        if: steps.check-url.outputs.skip != 'true'
        env:
          STAGING_URL: ${{ secrets.STAGING_APP_URL }}
        run: |
          mkdir -p tmp/k6
          echo "Running k6 advisory against ${STAGING_URL}"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e BASE_URL="$STAGING_URL" \
            -e K6_SCENARIOS="smoke,average" \
            -v "$PWD:/workspace" \
            -w /workspace \
            grafana/k6:latest run --summary-export /workspace/tmp/k6/summary.json scripts/load-test.js
      - name: Upload k6 summary
        if: always() && steps.check-url.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: k6-advisory-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/k6/**
          if-no-files-found: warn

  bundle-analysis:
    runs-on: ubuntu-latest
    needs: lint-type-security
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build and analyze bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
        run: ANALYZE=true pnpm run build
      - name: Check bundle size budget
        env:
          BUNDLE_BUDGET_WARN_KB: "2750"
          BUNDLE_BUDGET_FAIL_KB: "3000"
        run: pnpm run check:bundle-budget

  lighthouse-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build-route-verify
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ (startsWith(secrets.NEXT_PUBLIC_SUPABASE_URL, 'https://') || startsWith(secrets.NEXT_PUBLIC_SUPABASE_URL, 'http://')) && secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "dummy_site_key"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Resolve Chromium path for Lighthouse
        run: |
          CHROME_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Build Next.js app
        run: pnpm run build
      - name: Lighthouse quality audit
        run: pnpm run quality:lighthouse

  safety-gate-snapshot:
    runs-on: ubuntu-latest
    needs: lint-type-security
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run safety gate (CI mode)
        run: pnpm run safety:ci-review -- --fail-fast
      - name: Upload safety gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-gate-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/safety-gate/**
          if-no-files-found: error
