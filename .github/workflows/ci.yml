name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  lint-type-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Shared static policy
        run: pnpm safety:ci-review -- --checks=format,lint,types,tooling,openapi,imports,db-static,secrets,licenses,dependencies
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: static-audit
          path: tmp/safety-gate/**

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Dead-code scan
        run: pnpm safety:ci-review -- --checks=dead-code

  jscpd-advisory:
    name: Duplication budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Code duplication budget
        run: pnpm safety:ci-review -- --checks=duplication
      - name: Upload jscpd report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jscpd-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/jscpd/**
          if-no-files-found: warn

  # Pushes and PRs scan only their new commits; security.yml rescans the whole
  # history weekly. Reviewed fixture exceptions live in .gitleaks.toml.
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          # The repository is public: keep findings in the job log, not in a
          # downloadable artifact.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # Fails only on findings this change introduces; the full result set goes to
  # private code scanning so existing findings stay visible until fixed.
  semgrep:
    name: Semgrep static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3 # 1.180.0 image digest; secret-scan: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fail on new findings
        env:
          BASELINE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASELINE" ] || [ "$BASELINE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::No baseline commit for this event; the full scan below still reports to code scanning."
            exit 0
          fi
          semgrep scan --config p/default --metrics=off --error --baseline-commit "$BASELINE"
      - name: Full scan
        if: always() && github.event_name == 'push'
        run: semgrep scan --config p/default --metrics=off --sarif --output semgrep.sarif
      - name: Upload to code scanning
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # Reviewed exceptions, each with a reason and an expiry, live in osv-scanner.toml.
  osv-scanner:
    name: Dependency vulnerabilities (OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the lockfile against OSV
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=pnpm-lock.yaml

  unit-api-contract:
    runs-on: ubuntu-latest
    needs: lint-type-security
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Coverage gate
        env:
          STRICT_COVERAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: pnpm safety:ci-review -- --checks=unit,coverage,db-trials,db-commercial,db-media,db-visits,db-staff-roles,db-decisions,db-queue-claims,db-operation-jobs,db-dsar,db-dashboard,db-admin-lists,db-business-counts,contracts,canaries,preflight
  build-route-verify:
    runs-on: ubuntu-latest
    needs: lint-type-security
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build Next.js app
        run: pnpm run build
      - name: Verify critical payment routes in build
        run: |
          echo "Checking critical addon/payment routes exist in build output..."
          MISSING=0
          for route in \
            "api/listings/\\[id\\]/featured" \
            "api/listings/\\[id\\]/urgent" \
            "api/listings/\\[id\\]/boost" \
            "api/businesses/\\[id\\]/boost" \
            "api/billing/create-checkout"; do
            if ! find .next/server/app -path "*${route}*" -print -quit 2>/dev/null | grep -q .; then
              echo "::error::MISSING ROUTE: ${route} not found in production build"
              MISSING=$((MISSING + 1))
            else
              echo "✓ ${route}"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::${MISSING} critical route(s) missing from build. Failing CI."
            exit 1
          fi
          echo "All critical payment routes verified in build output."

  db-rls:
    runs-on: ubuntu-latest
    env:
      # secrets context is not allowed in step-level if conditions, so map
      # these to env first and reference env in the Docker Hub login step.
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Anonymous Docker Hub pulls are rate-limited per runner IP and make
      # `supabase start` flaky; logging in (when credentials are configured)
      # raises the pull quota.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Full migrations, PostgreSQL/PostgREST RLS and races
        run: pnpm safety:ci-review -- --checks=isolated-db
      - name: Preserve database evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: isolated-database-audit
          path: |
            tmp/isolated-db/**
            tmp/safety-gate/**

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [unit-api-contract, build-route-verify]
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chrome]
    env:
      PLAYWRIGHT_TEST_MODE: "1"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "dummy_site_key"
      TURNSTILE_SECRET_KEY: "dummy_secret_key" # secret-scan: allow
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps
      - run: pnpm exec playwright test --grep "@smoke" --project ${{ matrix.project }}

  launch-flows-bundle:
    runs-on: ubuntu-latest
    needs: [unit-api-contract, build-route-verify]
    env:
      PLAYWRIGHT_TEST_MODE: "1"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "dummy_site_key"
      TURNSTILE_SECRET_KEY: "dummy_secret_key" # secret-scan: allow
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Isolated payment, KYC and DSAR browser verification
        run: pnpm safety:release -- --checks=browser
      - name: Upload isolated browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/isolated-browser/*.log
            tmp/isolated-browser/*.json
            tmp/isolated-browser/checkout-*/test-results/**
            tmp/safety-gate/**
          if-no-files-found: warn

  e2e-full-matrix:
    runs-on: ubuntu-latest
    # A stalled browser install once held this job for 4h+ (run 37674601509).
    timeout-minutes: 45
    needs:
      [e2e-smoke, launch-flows-bundle, db-rls, payment-kyc-regressions, audit-tooling-platforms]
    strategy:
      fail-fast: false
      matrix:
        # WebKit/mobile-safari are intentionally quarantined from the full push
        # matrix because the current suite already marks their page-navigation
        # coverage as unreliable under headless CI.
        project: [chromium, firefox, mobile-chrome]
    env:
      PLAYWRIGHT_TEST_MODE: "1"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "dummy_site_key"
      TURNSTILE_SECRET_KEY: "dummy_secret_key" # secret-scan: allow
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps ${{ matrix.project == 'firefox' && 'chromium firefox' || 'chromium' }}
        timeout-minutes: 10
      - run: pnpm exec playwright test --project ${{ matrix.project }}
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-full-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

  perf-baseline:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: e2e-full-matrix
    steps:
      - name: Check staging URL is configured
        id: check-url
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "STAGING_APP_URL not set, skipping perf baseline"
          fi
        env:
          STAGING_URL: ${{ secrets.STAGING_APP_URL }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check-url.outputs.skip != 'true'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.check-url.outputs.skip != 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.check-url.outputs.skip != 'true'
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
        if: steps.check-url.outputs.skip != 'true'
      - name: Run performance baseline check
        if: steps.check-url.outputs.skip != 'true'
        env:
          PERF_BASE_URL: ${{ secrets.STAGING_APP_URL }}
          PERF_REQUESTS: "80"
          PERF_CONCURRENCY: "8"
          PERF_P95_MS: "1200"
          PERF_MAX_ERROR_RATE: "0.01"
        run: pnpm run test:perf

  k6-advisory:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    needs: perf-baseline
    steps:
      - name: Check staging URL is configured
        id: check-url
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "STAGING_APP_URL not set, skipping k6 advisory"
          fi
        env:
          STAGING_URL: ${{ secrets.STAGING_APP_URL }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check-url.outputs.skip != 'true'
      - name: Run k6 advisory profile
        if: steps.check-url.outputs.skip != 'true'
        env:
          STAGING_URL: ${{ secrets.STAGING_APP_URL }}
        run: |
          mkdir -p tmp/k6
          echo "Running k6 advisory against ${STAGING_URL}"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e BASE_URL="$STAGING_URL" \
            -e K6_SCENARIOS="smoke,average" \
            -v "$PWD:/workspace" \
            -w /workspace \
            grafana/k6:latest run --summary-export /workspace/tmp/k6/summary.json scripts/load-test.js
      - name: Upload k6 summary
        if: always() && steps.check-url.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-advisory-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/k6/**
          if-no-files-found: warn

  bundle-analysis:
    runs-on: ubuntu-latest
    needs: lint-type-security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build and analyze bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
        run: ANALYZE=true pnpm run build
      - name: Check bundle size budget
        run: pnpm run check:bundle-budget

  lighthouse-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build-route-verify
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "dummy_site_key"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Resolve Chromium path for Lighthouse
        run: |
          CHROME_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Build Next.js app
        run: pnpm run build
      - name: Lighthouse quality audit
        run: pnpm run quality:lighthouse
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/lighthouse/**
          if-no-files-found: warn

  safety-gate-snapshot:
    runs-on: ubuntu-latest
    needs: lint-type-security
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run safety gate (CI mode)
        run: pnpm run safety:ci-review -- --dry-run
      - name: Upload safety gate artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safety-gate-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/safety-gate/**
          if-no-files-found: error

  payment-kyc-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm safety:ci-review -- --checks=payment-unit,kyc-unit,db-payments,db-kyc,db-business-evidence
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: payment-kyc-audit
          path: tmp/safety-gate/**

  audit-tooling-platforms:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
