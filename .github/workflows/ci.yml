name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default; jobs that need more ask for it themselves.
permissions:
  contents: read

# A newer push to a pull request cancels that pull request's older run. Runs on
# main are never cancelled (each has its own group), so every release commit
# gets a complete result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # Rebuilds the production (foundation) schema from database/foundation in an
  # embedded Postgres, compares its fingerprint with fingerprint.json, checks
  # the committed readable snapshot (database/foundation/current) and the API
  # manifests and runtime types against it.
  foundation-replay:
    name: foundation-replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent is the pull request's base.
          fetch-depth: 2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Replay the foundation schema, check its access-policy invariants and fingerprint
        run: pnpm db:foundation:replay
      - name: Regenerate the readable schema snapshot (database/foundation/current)
        run: pnpm db:foundation:snapshot
      - name: Fail when the committed snapshot is out of date
        run: |
          git diff --exit-code -- database/foundation/current
          untracked="$(git status --porcelain --untracked-files=all -- database/foundation/current)"
          if [ -n "$untracked" ]; then
            echo "::error::database/foundation/current is out of date; run pnpm db:foundation:snapshot and commit it."
            echo "$untracked"
            exit 1
          fi
      - name: Check the API manifests and runtime types against the replay
        run: pnpm db:foundation:api-check
      # Safe order: every update file has an applied-register line, and an API
      # command or argument removed or renamed against the base commit needs a
      # recorded second step (database/foundation/contract-steps.json).
      - name: Check the update register and API removals against the base commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Checked out as the merge commit: parent 1 is the base branch tip.
            if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -ne 3 ]; then
              echo "::error::Expected the pull request merge commit; cannot find the base."
              exit 1
            fi
            base="$(git rev-parse HEAD^1)"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            for attempt in 1 2 3; do
              if git fetch --no-tags --depth=1 origin "$BEFORE_SHA"; then base="$BEFORE_SHA"; break; fi
              sleep $((attempt * 5))
            done
            if [ -z "$base" ]; then
              # Main already merged this change after its pull request passed;
              # do not block the release on a fetch failure.
              echo "::warning::Could not fetch the previous main commit; comparing with HEAD^1 instead."
              base="$(git rev-parse HEAD^1)"
            fi
          fi
          node scripts/check-foundation-update-order.mjs --base "$base"

  # Updates reach staging before merge. Pull requests only, so a paused or
  # unreachable staging project can never block a production deploy (deploy
  # needs a green main CI run). Inert until the owner creates staging and sets
  # the FOUNDATION_STAGING_* secrets: the check job is then skipped, not passed.
  staging-database-config:
    name: Staging database configured
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check FOUNDATION_STAGING_SUPABASE_URL
        id: check
        env:
          STAGING_URL: ${{ secrets.FOUNDATION_STAGING_SUPABASE_URL }}
        run: |
          if [ -n "$STAGING_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FOUNDATION_STAGING_* secrets are not set: the staging database check is skipped."
          fi

  # Read-only: anonymous probes with the staging publishable key. Fails only
  # when PostgREST reports a command of this change missing on staging; an
  # unreachable or paused project is a warning (inconclusive).
  staging-database:
    name: Staging database in step
    runs-on: ubuntu-latest
    needs: staging-database-config
    if: github.event_name == 'pull_request' && needs.staging-database-config.outputs.configured == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Compare staging with this change's updates
        env:
          FOUNDATION_STAGING_SUPABASE_URL: ${{ secrets.FOUNDATION_STAGING_SUPABASE_URL }}
          FOUNDATION_STAGING_PROJECT_REF: ${{ secrets.FOUNDATION_STAGING_PROJECT_REF }}
          FOUNDATION_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.FOUNDATION_STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm exec tsx scripts/check-foundation-update-drift.ts --target=staging

  # plpgsql_check over every plpgsql function of the replayed schema, in a
  # throwaway network-less Postgres 17 container (the Supabase image that ships
  # plpgsql_check). Fails on any error not reviewed in lint-baseline.json and on
  # more warnings than the baseline.
  foundation-sql-lint:
    name: foundation-sql-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Pull the pinned Postgres image
        run: docker pull "$(node -e "import('./scripts/lib/foundation-sql-lint.mjs').then((m) => console.log(m.LINT_IMAGE))")"
      - name: Lint the replayed foundation SQL with plpgsql_check
        run: pnpm db:foundation:lint
      - name: Post lifecycle and staff rule behaviour on the replayed schema
        run: pnpm db:foundation:lifecycle-test

  lint-type-security:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Shared static policy
        run: pnpm safety:ci-review -- --checks=format,lint,types,openapi,imports,legacy-surface,frontend-freeze,secrets,licenses,dependencies
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-audit
          path: tmp/safety-gate/**

  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Dead-code scan
        run: pnpm safety:ci-review -- --checks=dead-code

  jscpd-advisory:
    name: Duplication budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Code duplication budget
        run: pnpm safety:ci-review -- --checks=duplication
      - name: Upload jscpd report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jscpd-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/jscpd/**
          if-no-files-found: warn

  # Checks the workflow files themselves (expressions, job graph, shell
  # scripts via shellcheck). Reviewed exceptions live in .github/actionlint.yaml.
  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the workflows
        run: |
          image=rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # secret-scan: allow image digest
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo "$image" -no-color -oneline

  # Security audit of the workflow files. Advisory while its existing findings
  # are triaged: it reports in the log and job summary but never fails CI.
  workflow-audit-advisory:
    name: Workflow security audit (zizmor, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the workflows (offline)
        run: |
          {
            echo '## Workflow security audit (zizmor, advisory)'
            echo
            echo '```'
            image=ghcr.io/zizmorcore/zizmor:1.14.2@sha256:d18a6c1e37733db34fbb516e1f168687db53f2e6601ca44d061700757a38ad95 # secret-scan: allow image digest
            docker run --rm --network none -v "$PWD:/repo:ro" -w /repo "$image" --offline --no-progress --format plain .github/workflows 2>&1 | tail -n 200
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Pushes and PRs scan only their new commits; security.yml rescans the whole
  # history weekly. Reviewed fixture exceptions live in .gitleaks.toml.
  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          # The repository is public: keep findings in the job log, not in a
          # downloadable artifact.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # Fails only on findings this change introduces; the full result set goes to
  # private code scanning so existing findings stay visible until fixed.
  semgrep:
    name: Semgrep static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3 # 1.180.0 image digest; secret-scan: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fail on new findings
        env:
          BASELINE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASELINE" ] || [ "$BASELINE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::No baseline commit for this event; the full scan below still reports to code scanning."
            exit 0
          fi
          semgrep scan --config p/default --metrics=off --error --strict --timeout 60 --timeout-threshold 0 --json-output semgrep-diff.json --baseline-commit "$BASELINE"
      - name: Full scan
        if: always() && github.event_name == 'push'
        run: semgrep scan --config p/default --metrics=off --strict --timeout 60 --timeout-threshold 0 --sarif --output semgrep.sarif
      - name: Upload to code scanning
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Preserve Semgrep findings and parser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-diagnostics
          path: semgrep-diff.json

  # Reviewed exceptions, each with a reason and an expiry, live in osv-scanner.toml.
  osv-scanner:
    name: Dependency vulnerabilities (OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the lockfile against OSV
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=pnpm-lock.yaml

  unit-api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 31
    needs: lint-type-security
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Coverage gate
        env:
          STRICT_COVERAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: pnpm safety:ci-review -- --checks=coverage,unit-coverage-excluded,contracts,preflight
      - name: Preserve unit, coverage and contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-contract-audit
          path: tmp/safety-gate/**
  build-route-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-type-security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Prepare isolated foundation configuration
        run: node scripts/prepare-cloudflare-runtime-check.mjs
      - name: Build Cloudflare app
        run: pnpm run build:cloudflare
      - name: Verify built Worker startup in workerd
        timeout-minutes: 5
        run: pnpm test:cloudflare:startup
      # Cloudflare refuses a compressed Worker over 10 MB; stay under 9.5 MB.
      - name: Worker size budget
        timeout-minutes: 5
        run: pnpm check:worker-size
      - name: Verify critical payment routes in build
        run: |
          echo "Checking critical addon/payment routes exist in build output..."
          MISSING=0
          for route in \
            "api/listings/\\[id\\]/featured" \
            "api/listings/\\[id\\]/urgent" \
            "api/listings/\\[id\\]/boost" \
            "api/businesses/\\[id\\]/boost" \
            "api/billing/create-checkout"; do
            if ! find .next/server/app -path "*${route}*" -print -quit 2>/dev/null | grep -q .; then
              echo "::error::MISSING ROUTE: ${route} not found in production build"
              MISSING=$((MISSING + 1))
            else
              echo "✓ ${route}"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::${MISSING} critical route(s) missing from build. Failing CI."
            exit 1
          fi
          echo "All critical payment routes verified in build output."
      # Payment and KYC provider callbacks, verification start and pricing
      # (scripts/lib/built-routes.mjs), checked in the generated route manifest.
      - name: Verify required routes in the build manifest
        run: node scripts/check-built-routes.mjs
      # The Worker runtime proof (the startup check's report and the build
      # fingerprint), formerly uploaded by the separate "Foundation Worker
      # runtime" job, which built the same Worker a second time.
      - name: Preserve runtime proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-worker-runtime
          include-hidden-files: true
          path: |
            tmp/cloudflare-runtime/latest.json
            .open-next/build-fingerprint.json

  # Builds the site once, at minute 0, with the fixed browser-test settings
  # (scripts/start-playwright-server.cjs). The browser jobs download it and
  # serve it with PLAYWRIGHT_SKIP_BUILD=1 instead of each building it again.
  # The visual job builds its own, for the foundation test copy.
  build-e2e:
    name: Browser test build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_TEST_MODE: "1"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "dummy_site_key"
      TURNSTILE_SECRET_KEY: "dummy_secret_key" # secret-scan: allow
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      # Test-serving build only; lint-type-security runs tsc on this commit.
      VERIFYMZANSI_SKIP_NEXT_TYPECHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build the site for the browser tests
        run: |
          node scripts/start-playwright-server.cjs --build-only
          test -f .next/BUILD_ID
      # Named per run, not per attempt: re-running only a failed browser job
      # reuses this build (the build job itself is not re-run).
      - name: Keep the build for the browser jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build-${{ github.run_id }}
          overwrite: true
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
          path: |
            .next
            !.next/cache
            public/vendor

  e2e-full-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    needs: [lint-type-security, build-e2e]
    strategy:
      fail-fast: false
      matrix:
        # WebKit/mobile-safari are intentionally quarantined from the full push
        # matrix because the current suite already marks their page-navigation
        # coverage as unreliable under headless CI.
        project: [chromium, firefox, mobile-chrome]
    env:
      PLAYWRIGHT_TEST_MODE: "1"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "dummy_site_key"
      TURNSTILE_SECRET_KEY: "dummy_secret_key" # secret-scan: allow
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-browsers
        with:
          browsers: ${{ matrix.project == 'firefox' && 'chromium firefox' || 'chromium' }}
      - name: Use the shared browser test build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-build-${{ github.run_id }}
      # Picture checks (@visual) run only in the visual-regression job's pinned
      # container, where browser and fonts match the approved pictures.
      - run: pnpm exec playwright test --project "$BROWSER_PROJECT" --grep-invert @visual
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
          PLAYWRIGHT_SKIP_BUILD: "1"
          PLAYWRIGHT_JSON_REPORT: test-results/e2e-full-${{ matrix.project }}.json
      # Retries (playwright.config.ts) can hide new flakiness: count it.
      - name: Summarise results, including tests that passed only on retry
        if: always()
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
        run: node scripts/e2e-foundation-summary.mjs "test-results/e2e-full-$BROWSER_PROJECT.json" "$BROWSER_PROJECT" "" "Browser tests" | tee -a "$GITHUB_STEP_SUMMARY"
      # A run that skipped them must not count as KYC proof
      # (e2e/kyc-authenticated.spec.ts, scripts/lib/kyc-browser-evidence.ts).
      - name: Prove the signed-in KYC scenarios passed
        if: matrix.project != 'firefox'
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
        run: pnpm exec tsx scripts/check-kyc-browser-report.ts "test-results/e2e-full-$BROWSER_PROJECT.json" "$BROWSER_PROJECT"
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-full-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

  # Picture checks of the frontend the owner chose (commit 0b562f42, roadmap
  # M0.12): the ten main public pages at 375, 800 and 1280 px plus dark mode
  # for home, pricing and login, compared with approved Linux pictures. Runs in
  # the pinned Playwright image (same browser build and fonts as when the
  # pictures were made). A required check: a difference from an approved
  # picture fails the workflow, so it also blocks the deploy.
  # Picture checks of the chosen frontend, served by the live backend's code
  # (foundation) from the private local test copy, as in workflow "E2E
  # foundation": a throwaway Supabase stack on the runner's own Docker, built
  # only from database/foundation/, no secrets, nothing hosted. The stack needs
  # Docker, so this job runs on the runner, not in a container; the pictures
  # need the pinned browser build and fonts, so scripts/foundation-visual.mjs
  # runs Playwright inside the pinned Playwright image (`docker run --network
  # host`, image pinned by digest in that script) against the website on the
  # runner's 127.0.0.1. Approved pictures:
  # e2e/foundation/visual-regression.spec.ts-snapshots/.
  visual-regression:
    name: Visual regression (chosen frontend)
    runs-on: ubuntu-latest
    needs: lint-type-security
    # Expected about 12-14 minutes (install, stack, build, image, 33 pictures);
    # locally on 4 cores: fresh stack 0.5-1, build 4.6, pictures about 2.
    # Step ceilings: stack 5, build 10, image 5, pictures 10.
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      PLAYWRIGHT_JSON_REPORT: test-results/visual-report.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Same reason as in workflow "E2E foundation": the copy's fixed ports must
      # never be handed out to outgoing connections.
      - name: Keep the test copy's ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=55440-55460
      - name: Start the test copy (local stack, schema proof, test people)
        timeout-minutes: 5
        run: node --import tsx scripts/foundation-e2e.mjs up
      - name: Build the website for the test copy
        timeout-minutes: 10
        run: node --import tsx scripts/foundation-e2e.mjs build
      - name: Fetch the pinned browser image
        timeout-minutes: 5
        run: node --import tsx scripts/foundation-visual.mjs pull
      - name: Compare the main screens with the approved pictures
        timeout-minutes: 10
        run: node --import tsx scripts/foundation-visual.mjs --retries=1
      - name: List the screens that differ
        if: always()
        run: node scripts/visual-diff-summary.mjs test-results/visual-report.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload expected, actual and diff pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/visual
            test-results/
            tmp/foundation-e2e/visual-website.log
          if-no-files-found: warn
      - name: Delete the test copy
        if: always()
        run: node --import tsx scripts/foundation-e2e.mjs down

  # Decides once whether a staging address exists. The jobs that need one test
  # this output in their job-level `if:`, so without it they show as skipped
  # in the run summary instead of a success that measured nothing.
  staging-config:
    name: Staging address configured
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check STAGING_APP_URL
        id: check
        env:
          STAGING_URL: ${{ secrets.STAGING_APP_URL }}
        run: |
          if [ -n "$STAGING_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::STAGING_APP_URL is not set: perf-baseline and k6-advisory are skipped."
          fi

  perf-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.staging-config.outputs.configured == 'true'
    needs: [e2e-full-matrix, staging-config]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run performance baseline check
        env:
          PERF_BASE_URL: ${{ secrets.STAGING_APP_URL }}
          PERF_REQUESTS: "80"
          PERF_CONCURRENCY: "8"
          PERF_P95_MS: "1200"
          PERF_MAX_ERROR_RATE: "0.01"
        run: pnpm run test:perf

  k6-advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.staging-config.outputs.configured == 'true'
    continue-on-error: true
    needs: [perf-baseline, staging-config]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run k6 advisory profile
        env:
          STAGING_URL: ${{ secrets.STAGING_APP_URL }}
        run: |
          mkdir -p tmp/k6
          image=grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d # secret-scan: allow image digest
          echo "Running k6 advisory against ${STAGING_URL}"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e BASE_URL="$STAGING_URL" \
            -e K6_SCENARIOS="smoke,average" \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$image" run --summary-export /workspace/tmp/k6/summary.json scripts/load-test.js
      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-advisory-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/k6/**
          if-no-files-found: warn

  # Also runs the advisory Lighthouse audit on the same build (it used to
  # build the app a second time in its own job).
  bundle-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-type-security
    env:
      # Measurement build only; lint-type-security runs tsc on this commit.
      VERIFYMZANSI_SKIP_NEXT_TYPECHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Prepare isolated foundation build configuration
        run: node scripts/prepare-cloudflare-runtime-check.mjs
      - name: Build and analyze bundle
        run: ANALYZE=true pnpm run build
      - name: Check bundle size budget
        run: pnpm run check:bundle-budget
      - name: Install Chromium for Lighthouse
        continue-on-error: true
        timeout-minutes: 3
        run: |
          pnpm exec playwright install chromium
          CHROME_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      # Advisory: a step limit and continue-on-error keep it from failing
      # bundle-analysis (a job-level timeout would ignore continue-on-error).
      - name: Lighthouse quality audit (advisory)
        continue-on-error: true
        timeout-minutes: 5
        run: pnpm run quality:lighthouse
      - name: Upload Lighthouse reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/lighthouse/**
          if-no-files-found: warn

  audit-tooling-platforms:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:tooling
      - run: pnpm safety:ci-review -- --dry-run --skip-optional
