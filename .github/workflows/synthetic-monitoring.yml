name: Synthetic Monitoring

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check production URL is configured
        id: check-url
        run: |
          if [ -z "$PROD_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "PRODUCTION_APP_URL not set, skipping smoke checks"
          fi
        env:
          PROD_URL: ${{ secrets.PRODUCTION_APP_URL }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.check-url.outputs.skip != 'true'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        if: steps.check-url.outputs.skip != 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.check-url.outputs.skip != 'true'
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
        if: steps.check-url.outputs.skip != 'true'
      - name: Run synthetic smoke checks
        if: steps.check-url.outputs.skip != 'true'
        env:
          SMOKE_BASE_URL: ${{ secrets.PRODUCTION_APP_URL }}
        run: pnpm run test:smoke

      - name: Check production dependency readiness
        if: steps.check-url.outputs.skip != 'true'
        env:
          APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
        run: pnpm exec tsx scripts/check-deployment-health.ts

  worker-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check production URL is configured
        id: check-prod
        run: |
          if [ -z "$PROD_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "PRODUCTION_APP_URL not set, skipping worker health checks"
          fi
        env:
          PROD_URL: ${{ secrets.PRODUCTION_APP_URL }}

      - name: Check KYC Encryptor worker health
        if: steps.check-prod.outputs.skip != 'true'
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "KYC_ENCRYPTOR_URL not set, skipping"
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' "$WORKER_URL")
          if [ "$status" != "200" ]; then
            echo "::error::KYC Encryptor health check failed (HTTP $status)"
            exit 1
          fi
          echo "KYC Encryptor: healthy"
        env:
          WORKER_URL: ${{ secrets.KYC_ENCRYPTOR_URL }}

      - name: Check Rate Limiter worker health
        if: steps.check-prod.outputs.skip != 'true'
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "RATE_LIMITER_URL not set, skipping"
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' "$WORKER_URL")
          if [ "$status" != "200" ]; then
            echo "::error::Rate Limiter health check failed (HTTP $status)"
            exit 1
          fi
          echo "Rate Limiter: healthy"
        env:
          WORKER_URL: ${{ secrets.RATE_LIMITER_URL }}

      - name: Check Retention Cleanup worker health
        if: steps.check-prod.outputs.skip != 'true'
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "RETENTION_CLEANUP_URL not set, skipping"
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' "$WORKER_URL")
          if [ "$status" != "200" ]; then
            echo "::error::Retention Cleanup health check failed (HTTP $status)"
            exit 1
          fi
          echo "Retention Cleanup: healthy"
        env:
          WORKER_URL: ${{ secrets.RETENTION_CLEANUP_URL }}
