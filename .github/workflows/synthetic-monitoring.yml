name: Synthetic Monitoring

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Read-only by default; jobs that need more ask for it themselves.
permissions:
  contents: read

# Every step either checks something real or fails: a missing setting is a
# failure, never a skip that reports green. The scheduled companion Workers are
# watched by their failed-run records and optional heartbeats instead
# (docs/RUNBOOK.md, "Monitoring and alerts").
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check production URL is configured
        run: |
          if [ -z "$PROD_URL" ]; then
            echo "::error::PRODUCTION_APP_URL is not set, so production was not checked."
            exit 1
          fi
        env:
          PROD_URL: ${{ secrets.PRODUCTION_APP_URL }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # A Cloudflare challenge is reported as INCONCLUSIVE (a warning and the
      # step summary), never as a pass; the authenticated check below must pass.
      - name: Check public edge delivery
        id: public-edge
        env:
          APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
        run: pnpm exec tsx scripts/check-public-edge.ts

      - name: Check authenticated app smoke and production dependencies
        env:
          APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          SITE_MONITOR_API_KEY: ${{ secrets.SITE_MONITOR_API_KEY }}
        run: pnpm exec tsx scripts/check-site-monitor.ts
