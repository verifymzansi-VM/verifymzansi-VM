name: E2E foundation

# Browser tests of the restored website in foundation mode against a private,
# throwaway test copy (roadmap slice M0.7): a local Supabase stack (PostgreSQL
# 17, PostgREST, GoTrue and the Mailpit mail catcher) on the runner's own
# Docker. Its database is built only from database/foundation/ and has no
# tables in schema public, like production. Payments use mock Ozow, SMS the
# e2e mock, email the local mail catcher. Nothing here reaches a hosted
# project or a real provider, and the job needs no secrets.
#
# Non-blocking while it proves itself: `e2e-foundation` is not a required
# check in .github/rulesets/protect-main.json, so a red run is visible on the
# pull request but does not block merging. It becomes required (and part of
# the release gate) after 10 consecutive green runs on main. The check to require is
# the aggregate job `e2e-foundation`, which fails unless every browser project
# passed; the per-project jobs need not be listed.
#
# Runs on main are a separate workflow run, outside the deploy gate (deploy
# waits only for workflow "CI"), so a red run here alerts (workflow "Failure
# alert") but never holds back a release until then.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "10 1 * * *" # Nightly at 01:10 UTC (03:10 in South Africa)
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs on main and
# scheduled runs are never cancelled: each commit gets its own group.
concurrency:
  group: e2e-foundation-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job per Playwright project, each on its own runner with its own test
  # copy (the copies never share data). Both projects in one step took about
  # 12 minutes against a 14-minute limit, so one retried test or a slow runner
  # timed the job out with no test failure recorded. Split, each project took
  # about 6.5 minutes of browser tests; with the backend-independent checks
  # moved here from the stub suite it is about 10 (e2e/foundation/PORTING.md).
  browser:
    name: e2e-foundation (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chrome]
    # Roadmap budget: the browser tests finish within 25 minutes of wall time;
    # the two projects run in parallel. Step ceilings: stack 5, build 10,
    # tests 22 (Playwright stops itself at 20 and writes its report first).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-browsers
      # The test copy's fixed ports (55443-55459) lie inside Linux's ephemeral
      # range (32768-60999). A server that binds one mid-run (the mock payment
      # provider on 55448) failed with EADDRINUSE when an ordinary outgoing
      # connection had been given that port. Reserved ports are never handed
      # out to outgoing connections; binding them explicitly still works.
      - name: Keep the test copy's ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=55440-55460
      - name: Start the test copy (local stack, schema proof, test people)
        timeout-minutes: 5
        run: node --import tsx scripts/foundation-e2e.mjs up
      - name: Build the website for the test copy
        timeout-minutes: 10
        run: node --import tsx scripts/foundation-e2e.mjs build
      - name: Note when the browser tests start
        run: echo "E2E_TESTS_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # About 10 minutes when clean. Playwright's own limit (20 minutes, about
      # 2 times a clean run) ends the run with its reports written, so a slow
      # run reads "timed out" in the summary instead of being cut off; the step
      # limit is the backstop if Playwright itself hangs.
      - name: Browser tests (${{ matrix.project }})
        timeout-minutes: 22
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
          PLAYWRIGHT_GLOBAL_TIMEOUT_MS: "1200000"
          PLAYWRIGHT_JSON_REPORT: test-results/foundation-${{ matrix.project }}.json
          PROJECT: ${{ matrix.project }}
        run: >-
          pnpm exec playwright test --config=playwright.foundation.config.ts
          --project="$PROJECT"
      - name: Summarise the browser tests
        if: always()
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          node scripts/e2e-foundation-summary.mjs "test-results/foundation-$PROJECT.json" "$PROJECT" "${E2E_TESTS_STARTED:-}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "${E2E_TESTS_STARTED:-}" ]; then
            echo "Browser tests ($PROJECT) ran for $(( $(date +%s) - E2E_TESTS_STARTED )) seconds."
          fi
      - name: Keep the browser report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-foundation-report-${{ matrix.project }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            playwright-report/foundation
            test-results/foundation
            test-results/foundation-${{ matrix.project }}.json
      - name: Delete the test copy
        if: always()
        run: node --import tsx scripts/foundation-e2e.mjs down

  # The single check name for the whole workflow (the one to require): green
  # only when every browser project passed.
  e2e-foundation:
    name: e2e-foundation
    runs-on: ubuntu-latest
    needs: browser
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    steps:
      - name: Every browser project passed
        env:
          RESULT: ${{ needs.browser.result }}
        run: |
          echo "Browser projects: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::At least one browser project did not pass ($RESULT). Its job summary says whether tests failed or the run timed out."
            exit 1
          fi
