name: E2E foundation

# Browser tests of the restored website in foundation mode against a private,
# throwaway test copy (roadmap slice M0.7): a local Supabase stack (PostgreSQL
# 17, PostgREST, GoTrue and the Mailpit mail catcher) on the runner's own
# Docker. Its database is built only from database/foundation/ and has no
# tables in schema public, like production. Payments use mock Ozow, SMS the
# e2e mock, email the local mail catcher. Nothing here reaches a hosted
# project or a real provider, and the job needs no secrets.
#
# Non-blocking while it proves itself: `e2e-foundation` is not a required
# check in .github/rulesets/protect-main.json, so a red run is visible on the
# pull request but does not block merging. It becomes required after five
# green days in a row (the nightly run counts them).
on:
  push: # TEMPORARY: trial run before the pull request; removed before review
    branches: [slice/M0-7-foundation-test-copy]
  pull_request:
    branches: [main]
  schedule:
    - cron: "10 1 * * *" # Nightly at 01:10 UTC (03:10 in South Africa)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-foundation:
    name: e2e-foundation
    runs-on: ubuntu-latest
    # Roadmap budget: chromium and mobile-chrome together under 25 minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-browsers
      - name: Start the test copy (local stack, schema proof, test people)
        timeout-minutes: 10
        run: node --import tsx scripts/foundation-e2e.mjs up
      - name: Build the website for the test copy
        timeout-minutes: 12
        run: node --import tsx scripts/foundation-e2e.mjs build
      - name: Browser tests (chromium and mobile-chrome)
        timeout-minutes: 10
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
        run: >-
          pnpm exec playwright test --config=playwright.foundation.config.ts
          --project=chromium --project=mobile-chrome
      - name: Keep the browser report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-foundation-report
          if-no-files-found: ignore
          retention-days: 7
          path: |
            playwright-report/foundation
            test-results/foundation
      - name: Delete the test copy
        if: always()
        run: node --import tsx scripts/foundation-e2e.mjs down
