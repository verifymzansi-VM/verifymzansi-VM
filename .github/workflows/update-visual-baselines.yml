name: Update Visual Baselines

# Makes new Linux pictures for e2e/foundation/visual-regression.spec.ts from
# the chosen branch, exactly as the CI visual-regression job compares them: the
# website runs against the private local foundation test copy on the runner,
# and the browser runs inside the pinned Playwright image
# (scripts/foundation-visual.mjs). A picture records how the owner's chosen
# frontend should look: only run this for a screen change the owner has
# approved, and let the owner review every new picture on its pull request.
# Never run it to make a red check green.
on:
  workflow_dispatch:

# Read-only by default; jobs that need more ask for it themselves.
permissions:
  contents: read

jobs:
  generate-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Repo default token is read-only; this job commits refreshed baselines.
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Keep the test copy's ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=55440-55460
      - name: Start the test copy (local stack, schema proof, test people)
        timeout-minutes: 5
        run: node --import tsx scripts/foundation-e2e.mjs up
      - name: Build the website for the test copy
        timeout-minutes: 10
        run: node --import tsx scripts/foundation-e2e.mjs build
      - name: Fetch the pinned browser image
        timeout-minutes: 5
        run: node --import tsx scripts/foundation-visual.mjs pull
      - name: Generate/update Chromium Linux baselines
        timeout-minutes: 10
        # Only pictures that differ beyond the allowance (or are missing) are
        # rewritten, so rendering noise never shows up as a change.
        run: node --import tsx scripts/foundation-visual.mjs --update-snapshots=changed
      - name: Delete the test copy
        if: always()
        run: node --import tsx scripts/foundation-e2e.mjs down
      # `main` only changes through a reviewed pull request, so baselines are
      # pushed to their own branch for the owner to review and merge.
      - name: Commit baselines to a review branch
        env:
          BASELINE_BRANCH: bot/visual-baselines-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "e2e/foundation/visual-regression.spec.ts-snapshots/*-chromium-linux.png"
          if git diff --cached --quiet; then
            echo "No baseline changes to commit"
          else
            git switch -c "$BASELINE_BRANCH"
            git commit -m "chore: update Chromium Linux visual baselines"
            git push origin "$BASELINE_BRANCH"
            echo "::notice::Baselines pushed to $BASELINE_BRANCH; open a pull request to review them."
          fi
