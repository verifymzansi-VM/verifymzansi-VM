name: Update Visual Baselines

on:
  workflow_dispatch:

jobs:
  generate-baselines:
    runs-on: ubuntu-latest
    # Repo default token is read-only; this job commits refreshed baselines.
    permissions:
      contents: write
    env:
      PLAYWRIGHT_TEST_MODE: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ (startsWith(secrets.NEXT_PUBLIC_SUPABASE_URL, 'https://') || startsWith(secrets.NEXT_PUBLIC_SUPABASE_URL, 'http://')) && secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Generate/update Chromium Linux baselines
        run: pnpm exec playwright test e2e/visual-regression.spec.ts --project=chromium --update-snapshots
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "e2e/visual-regression.spec.ts-snapshots/*-chromium-linux.png"
          if git diff --cached --quiet; then
            echo "No baseline changes to commit"
          else
            git commit -m "chore: update Chromium Linux visual baselines"
            git push
          fi
