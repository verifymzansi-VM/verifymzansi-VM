name: Cloudflare Candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Optional full SHA of a tested commit on main; blank uses current main"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cloudflare-candidate
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      DEPLOY_TARGET_SHA: ${{ inputs.source_commit || github.sha }}
      NODE_ENV: production
      WRANGLER_SEND_ERROR_REPORTS: "false"
      NEXT_PUBLIC_DATA_BACKEND: foundation
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.FOUNDATION_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.FOUNDATION_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FOUNDATION_SUPABASE_SECRET_KEY }}
      FOUNDATION_SUPABASE_URL: ${{ secrets.FOUNDATION_SUPABASE_URL }}
      FOUNDATION_PROJECT_REF: ${{ secrets.FOUNDATION_PROJECT_REF }}
      FOUNDATION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.FOUNDATION_SUPABASE_PUBLISHABLE_KEY }}
      FOUNDATION_SUPABASE_SECRET_KEY: ${{ secrets.FOUNDATION_SUPABASE_SECRET_KEY }}
      FOUNDATION_PHONE_OTP_KEY: ${{ secrets.FOUNDATION_PHONE_OTP_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.APP_URL }}
      AFRICASTALKING_API_KEY: ${{ secrets.AFRICASTALKING_API_KEY }}
      AFRICASTALKING_USERNAME: ${{ secrets.AFRICASTALKING_USERNAME }}
      AFRICASTALKING_SENDER_ID: ${{ secrets.AFRICASTALKING_SENDER_ID }}
      OZOW_ENV: ${{ secrets.OZOW_ENV }}
      OZOW_CLIENT_ID: ${{ secrets.OZOW_CLIENT_ID }}
      OZOW_CLIENT_SECRET: ${{ secrets.OZOW_CLIENT_SECRET }}
      OZOW_SITE_CODE: ${{ secrets.OZOW_SITE_CODE }}
      OZOW_PAYMENT_OAUTH_SCOPE: ${{ secrets.OZOW_PAYMENT_OAUTH_SCOPE }}
      OZOW_WEBHOOK_SECRET: ${{ secrets.OZOW_WEBHOOK_SECRET }}
      KYC_PROVIDER: ${{ secrets.KYC_PROVIDER }}
      KYC_WEBHOOK_SECRET: ${{ secrets.KYC_WEBHOOK_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BUCKET: verifymzansi-public
      R2_PRIVATE_BUCKET: verifymzansi-private
      KYC_ENCRYPTION_KEY: ${{ secrets.KYC_ENCRYPTION_KEY }}
      ID_ENCRYPTION_KEY: ${{ secrets.ID_ENCRYPTION_KEY }}
      HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
      IP_HASH_SECRET: ${{ secrets.IP_HASH_SECRET }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      NODE_OPTIONS: --max-old-space-size=4096
      INTERNAL_JOBS_SECRET: ${{ secrets.INTERNAL_JOBS_SECRET }}
      OPS_JOBS_SECRET: ${{ secrets.OPS_JOBS_SECRET }}
      HEALTH_DIAGNOSTIC_TOKEN: ${{ secrets.HEALTH_DIAGNOSTIC_TOKEN }}
      RATE_LIMITER_API_KEY: ${{ secrets.RATE_LIMITER_API_KEY }}
      OTP_RATE_LIMITER_URL: https://verifymzansi-rate-limiter.verifymzansi.workers.dev
      OTP_RATE_LIMITER_TIMEOUT_MS: "2500"
    steps:
      - name: Validate the requested source selector
        run: '[[ "$DEPLOY_TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_TARGET_SHA }}
          fetch-depth: 0
      - name: Require the exact source commit on main
        run: |
          test "$(git rev-parse HEAD)" = "$DEPLOY_TARGET_SHA"
          git merge-base --is-ancestor "$DEPLOY_TARGET_SHA" origin/main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prod=false
      - name: Match all public build settings to production bindings
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parse } from 'smol-toml';
          const vars = parse(fs.readFileSync('wrangler.toml', 'utf8')).env.production.vars;
          const entries = Object.entries(vars).filter(([name]) => name.startsWith('NEXT_PUBLIC_'));
          for (const [name, value] of entries) {
            if (typeof value !== 'string' || /[\r\n]/.test(value)) throw new Error('Invalid public binding: ' + name);
            if (process.env[name] && process.env[name] !== value) throw new Error('Build/binding mismatch: ' + name);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, entries.map(([name, value]) => name + '=' + value).join('\n') + '\n');
          console.log('Approved public build binding names: ' + entries.map(([name]) => name).join(', '));
          NODE
      - name: Require successful CI for this exact main commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/check-deployment-ci.ts
      - name: Verify hosted connection and candidate contracts
        run: pnpm exec tsx scripts/check-foundation-candidate.ts
      - name: Validate production configuration
        run: pnpm exec tsx scripts/validate-launch-env.ts --mode=production
      - name: Build and check the actual Worker
        run: |
          pnpm run build:cloudflare
          pnpm test:cloudflare:startup
      # The runtime verifier records the workflow event SHA. When a previous
      # green main commit is selected, preserve both revisions explicitly.
      - name: Record checked out source and workflow revisions
        run: |
          git rev-parse HEAD > tmp/cloudflare-runtime/source-commit.txt
          printf '%s\n' "$GITHUB_SHA" > tmp/cloudflare-runtime/workflow-commit.txt
      - name: Prepare additive scoped bindings
        run: node scripts/prepare-cloudflare-candidate-secrets.mjs
      # Upload only: no deploy, route, trigger or traffic-allocation command.
      # Existing provider, encryption, HMAC and R2 keys are inherited.
      - name: Upload inactive production candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec opennextjs-cloudflare upload --env production
          --secrets-file "$RUNNER_TEMP/cloudflare-candidate-secrets.json"
          --tag "$DEPLOY_TARGET_SHA" --message inactive-main-candidate
      - name: Reject an upload that rebuilt the verified artifact
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const proof = JSON.parse(fs.readFileSync('tmp/cloudflare-runtime/latest.json', 'utf8'));
          const built = JSON.parse(fs.readFileSync('.open-next/build-fingerprint.json', 'utf8'));
          if (proof.status !== 'PASS' || proof.fingerprint.fingerprint !== built.fingerprint) {
            throw new Error('Uploaded artifact differs from the Worker runtime proof');
          }
          console.log('Uploaded build fingerprint matches the verified Worker artifact.');
          NODE
      - name: Remove temporary binding file
        if: always()
        run: rm -f -- "$RUNNER_TEMP/cloudflare-candidate-secrets.json"
      - name: Preserve candidate build proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-candidate-proof
          include-hidden-files: true
          path: |
            tmp/cloudflare-runtime/latest.json
            tmp/cloudflare-runtime/source-commit.txt
            tmp/cloudflare-runtime/workflow-commit.txt
            .open-next/build-fingerprint.json
          if-no-files-found: warn
