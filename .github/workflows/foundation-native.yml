name: Foundation native

# Runs the native foundation test suite (pnpm test:foundation:native) against
# a throwaway local Supabase stack (PostgreSQL 17, PostgREST, GoTrue) on the
# runner's own Docker. Nothing here reaches a hosted project.
#
# The workflow starts for every pull request so that the `foundation-native`
# check always reports a result. A first step decides whether the pull request
# touches the suite's inputs; when it does not, the job ends green without
# starting Docker. (A workflow-level `paths:` filter would leave a required
# check waiting forever on unrelated pull requests.) Runs on main, nightly and
# manual runs always run the full suite.
#
# On main this workflow runs inside the CI run (ci.yml calls it through
# `workflow_call`), so the deploy, which needs the whole main CI run to
# succeed, waits for it: a red run here holds back the release. Pull requests,
# the nightly and manual runs start it on its own.
on:
  workflow_call:
  pull_request:
    branches: [main]
  schedule:
    - cron: "40 0 * * *" # Nightly at 00:40 UTC (02:40 in South Africa)
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs on main (called
# from CI) and scheduled runs are never cancelled: each commit gets its own
# group, so a later merge never cancels an earlier commit's release gate.
concurrency:
  group: foundation-native-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  foundation-native:
    name: foundation-native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request merge commit and its first parent (the base), so
          # the scope step can list exactly what the pull request changes.
          fetch-depth: 2
          persist-credentials: false
      - name: Decide whether the native suite inputs changed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Full run ($EVENT_NAME)."
            exit 0
          fi
          if ! changed="$(git diff --name-only HEAD^1 HEAD)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not list the changed files; running the full suite."
            exit 0
          fi
          inputs='^(database/foundation/|docs/backend-foundation/prototypes/|src/lib/|src/types/|src/app/api/|scripts/lib/foundation-|scripts/(test|prepare|start|stop|reset)-foundation-native\.mjs$|scripts/test-restored-post-commands\.mjs$|scripts/probe-foundation-|scripts/foundation-native-|package\.json$|pnpm-lock\.yaml$|\.github/workflows/foundation-native\.yml$)'
          matched="$(printf '%s\n' "$changed" | grep -E "$inputs" || true)"
          if [ -n "$matched" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Native suite inputs changed:"
            printf '%s\n' "$matched"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No native suite inputs changed; the suite is skipped and this check passes."
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Prepare the isolated fixture workspace
        if: steps.scope.outputs.run == 'true'
        run: node scripts/prepare-foundation-native.mjs
      - name: Start the local fixture stack (pinned Supabase CLI)
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 15
        run: pnpm foundation:native:start
      - name: Run the native foundation suite
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 40
        run: pnpm test:foundation:native
      # The suite withholds responses from its log; name the failed check,
      # its stage, error class and SQL state from the redacted results file.
      - name: Name the failed native checks
        if: failure() && steps.scope.outputs.run == 'true'
        run: node scripts/foundation-native-failure-summary.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fail when the committed native API types are out of date
        if: steps.scope.outputs.run == 'true'
        run: git diff --exit-code -- docs/backend-foundation/prototypes/native-api-types.ts
      - name: Preserve the redacted native results
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-native-results
          if-no-files-found: warn
          path: |
            docs/backend-foundation/evidence/native-*/results.json
            docs/backend-foundation/evidence/staff-read-*.json
            docs/backend-foundation/prototypes/native-api-types.ts
            tmp/backend-reconciliation/native-post-commands.json
      - name: Stop the local fixture stack
        if: always() && steps.scope.outputs.run == 'true'
        run: pnpm foundation:native:stop
