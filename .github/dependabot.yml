version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # .npmrc refuses versions younger than 7 days (minimum-release-age), so
    # proposing fresher releases fails every update. Wait 8 days for margin.
    cooldown:
      default-days: 8
    reviewers:
      - "verifymzansi-a11y"
    labels:
      - "dependencies"
    ignore:
      # jscpd 5 is a native rewrite that counts clones differently and
      # changed its JSON report, so the duplication budget
      # (scripts/check-jscpd-budget.ts) would need rebuilding. Stay on 4.x.
      - dependency-name: "jscpd"
        update-types: ["version-update:semver-major"]
      # Licence-gated: scripts/check-licenses.ts pins the reviewed versions.
      # Remotion's custom licence needs an owner re-review per version, and
      # @ffmpeg/core must match the self-hosted GPL files in public/vendor.
      - dependency-name: "remotion"
      - dependency-name: "@remotion/*"
      - dependency-name: "@ffmpeg/core"
    # Group minor and patch updates to reduce PR noise
    groups:
      production-deps:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # AI agent tooling under .agents/ is never built or deployed with the site.
  # `ignore` also applies to security updates, so this stops pull requests
  # for those manifests while the website entry above stays fully covered.
  - package-ecosystem: "npm"
    directories:
      - "/.agents/**"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # init, autobuild and analyze must share one version or CodeQL fails.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - "dependencies"
      - "ci"
