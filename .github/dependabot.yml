version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Owner's migration workflow keeps code on main. Review routine upgrades
    # manually until cutover; vulnerability alerts/security updates remain enabled.
    open-pull-requests-limit: 0
    # .npmrc refuses versions younger than 7 days (minimum-release-age), so
    # proposing fresher releases fails every update. Wait 8 days for margin.
    cooldown:
      default-days: 8
    reviewers:
      - "verifymzansi-a11y"
    labels:
      - "dependencies"
    ignore:
      # jscpd 5 is a native rewrite that counts clones differently and
      # changed its JSON report, so the duplication budget
      # (scripts/check-jscpd-budget.ts) would need rebuilding. Stay on 4.x.
      - dependency-name: "jscpd"
        update-types: ["version-update:semver-major"]
      # Licence-gated: scripts/check-licenses.ts pins the reviewed versions.
      # Remotion's custom licence needs an owner re-review per version, and
      # @ffmpeg/core must match the self-hosted GPL files in public/vendor.
      - dependency-name: "remotion"
      - dependency-name: "@remotion/*"
      - dependency-name: "@ffmpeg/core"
      # 10.76 bundles a WebAssembly build-time plugin into the server runtime;
      # Cloudflare Workers refuse it and every request returns 500 (2026-10-13,
      # getsentry/sentry-javascript#22794). Stay on 10.75.0 until a fixed v10/v11.
      # CI does not run workerd, so every Sentry bump needs a manual local
      # workerd check before it can ship; never propose one automatically.
      - dependency-name: "@sentry/nextjs"
        versions: [">= 10.75.1"]
      # 8.71.1 reports 1,373 false no-unused-vars errors in .js/.mjs/.cjs
      # (typescript-eslint/typescript-eslint#12980); fixed in 8.71.2.
      - dependency-name: "typescript-eslint"
        versions: ["8.71.1"]
      - dependency-name: "@typescript-eslint/*"
        versions: ["8.71.1"]
      # These must match `next` (16.3.8, a production dep). eslint-config-next
      # 16.4 adds stricter react-hooks rules with 5 findings to fix. Bump all
      # three together as one tested Next 16.4 upgrade, then drop this ignore.
      - dependency-name: "@next/env"
        versions: [">= 16.4.0"]
      - dependency-name: "eslint-config-next"
        versions: [">= 16.4.0"]
    # Group minor and patch updates to reduce PR noise
    groups:
      production-deps:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    # Same supply-chain wait as npm: a compromised action release is usually
    # caught and pulled within days.
    cooldown:
      default-days: 8
    # init, autobuild and analyze must share one version or CodeQL fails.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - "dependencies"
      - "ci"
