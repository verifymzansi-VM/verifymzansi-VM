version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "verifymzansi-a11y"
    labels:
      - "dependencies"
    ignore:
      # jscpd 5 is a native rewrite that counts clones differently and
      # changed its JSON report, so the duplication budget
      # (scripts/check-jscpd-budget.ts) would need rebuilding. Stay on 4.x.
      - dependency-name: "jscpd"
        update-types: ["version-update:semver-major"]
    # Group minor and patch updates to reduce PR noise
    groups:
      production-deps:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
