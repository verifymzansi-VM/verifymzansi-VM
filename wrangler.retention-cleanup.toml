# Scheduled trigger only. The app owns journal-backed cleanup and R2 access.
name = "verifymzansi-retention-cleanup"
main = "workers/retention-cleanup.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"
DATA_BACKEND = "foundation"
APP_URL = "https://verifymzansi.com"

[[services]]
binding = "APP"
service = "verifymzansi"

[triggers]
crons = ["0 * * * *"]

# WORKER_API_KEY matches the app's scoped INTERNAL_JOBS_SECRET.
# Database credentials and R2 bindings are intentionally absent here.
