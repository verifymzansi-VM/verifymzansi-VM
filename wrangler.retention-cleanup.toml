# Scheduled trigger only. The app owns journal-backed cleanup and R2 access.
name = "verifymzansi-retention-cleanup"
main = "workers/retention-cleanup.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"
DATA_BACKEND = "foundation"
APP_URL = "https://verifymzansi.com"

[[services]]
binding = "APP"
service = "verifymzansi"

[triggers]
# Every 5 minutes, matching the 5-minute cleanup lease: a run the app cannot
# finish is picked up by the next one. Each run makes at most 40 subrequests
# (src/lib/foundation/retention-jobs.ts); 288 runs a day.
crons = ["*/5 * * * *"]

# WORKER_API_KEY matches the app's scoped INTERNAL_JOBS_SECRET.
# Database credentials and R2 bindings are intentionally absent here.
